<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>بطولات FC 27 — منصة المباريات</title>
<meta name="description" content="منصة إدارة بطولات FC بين اللاعبين: جدول المباريات، النتائج، الترتيب، والإحصائيات." />
<meta name="theme-color" content="#07090a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="بطولات FC" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   هوية «لوحة النتائج» — بطولات FC
   ليل الملعب · لايم الهوية · فضي الانتظار · أحمر البث المباشر
   ============================================================ */
:root{
  --bg:#07090a; --bg-2:#0d100f;
  --surface:#141816; --surface-2:#1b201d; --surface-3:#262c27;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.135);
  --ink:#edf0ea; --ink-2:#98a094; --ink-3:#626a60;
  --gold:#d8e551; --gold-soft:rgba(216,229,81,.12); --gold-line:rgba(216,229,81,.30);
  --gold-grad:linear-gradient(135deg,#e4f06a,#b3c42c);
  --violet:#dfe3da; --violet-soft:rgba(223,227,218,.10);
  --live:#ff3b4e; --live-soft:rgba(255,59,78,.13);
  --win:#9fe04f; --win-soft:rgba(159,224,79,.13);
  --draw:#b9bfb2;
  --lose:#ff5566; --lose-soft:rgba(255,85,102,.12);
  --shadow:0 18px 44px rgba(0,0,0,.62);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.7;min-height:100vh;overflow-wrap:anywhere;
  background-image:radial-gradient(1100px 420px at 50% -260px,rgba(216,229,81,.07),transparent 70%);
  background-attachment:fixed;
}
.num{font-family:'Oxanium',monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== الهيكل ===== */
.app{max-width:760px;margin:0 auto;padding:0 13px calc(84px + env(safe-area-inset-bottom))}

/* ===== شريط علوي ===== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,13,18,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin:0 0 14px;padding:calc(8px + env(safe-area-inset-top)) 13px 8px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:9px}
.logo{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:.95rem;letter-spacing:-.2px;flex-shrink:0}
.logo b{font-family:'Oxanium';color:var(--gold);font-weight:800}
.spacer{flex:1}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:30px;
  padding:5px 12px;font-size:.66rem;font-weight:800;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;max-width:150px;min-width:0;flex-shrink:1}
.chip:hover{border-color:var(--gold-line);color:var(--gold)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.me{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}

/* ===== التنقل السفلي ===== */
.nav{position:fixed;bottom:0;right:0;left:0;z-index:50;
  background:rgba(14,17,23,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--ink-3);
  font-size:.6rem;font-weight:800;transition:.18s}
.nav a svg{width:20px;height:20px;stroke-width:1.9}
.nav a.on{color:var(--gold)}
.nav a.on svg{filter:drop-shadow(0 0 8px rgba(216,229,81,.45))}

/* ===== عناصر عامة ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:11px}
.sec{margin:20px 0 10px;display:flex;align-items:center;gap:9px}
.sec h2{font-size:.86rem;font-weight:900;letter-spacing:-.2px}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .more{font-size:.64rem;font-weight:800;color:var(--gold);text-decoration:none}
.eyebrow{font-size:.6rem;font-weight:800;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:.64rem}
.center{text-align:center}

.btn{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);
  padding:9px 16px;border-radius:30px;font-size:.72rem;font-weight:800;cursor:pointer;
  transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--gold-line);color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--gold-grad);color:#0d1004;border:none;font-weight:900}
.btn.solid:hover{color:#0d1004;box-shadow:0 8px 24px rgba(216,229,81,.24)}
.btn.danger{background:var(--lose-soft);border-color:rgba(255,85,102,.35);color:var(--lose)}
.btn.danger:hover{background:var(--lose);color:#fff;border-color:transparent}
.btn.ok{background:var(--win-soft);border-color:rgba(159,224,79,.35);color:var(--win)}
.btn.ok:hover{background:var(--win);color:#0e2105;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.66rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn svg{width:14px;height:14px;flex-shrink:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.tight{gap:6px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:.6rem;font-weight:800;
  padding:3px 10px;border-radius:30px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
.tag.live{background:var(--live-soft);color:var(--live);border-color:rgba(255,59,78,.3)}
.tag.win{background:var(--win-soft);color:var(--win);border-color:rgba(159,224,79,.3)}
.tag.violet{background:var(--violet-soft);color:var(--violet);border-color:rgba(223,227,218,.28)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,78,.5)}70%{box-shadow:0 0 0 7px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}

/* ===== لوحة النتيجة ===== */
.board{position:relative;display:block;width:100%;text-align:right;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px 12px 12px;cursor:pointer;transition:.2s;overflow:hidden}
.board:hover{border-color:var(--line-2);transform:translateY(-1px)}
.board::before{content:'';position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--ink-3)}
.board[data-s="live"]::before{background:var(--live)}
.board[data-s="pending_confirmation"]::before{background:var(--violet)}
.board[data-s="completed"]::before{background:var(--win)}
.board[data-s="disputed"]::before{background:var(--lose)}
.board[data-s="postponed"]::before,.board[data-s="cancelled"]::before{background:var(--ink-3)}
.board-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.board-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side.b{flex-direction:row-reverse;text-align:left}
.side .nm{font-size:.78rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side .nm.dimmed{color:var(--ink-3);font-weight:700}
.av{width:30px;height:30px;border-radius:9px;background:var(--surface-3);
  display:grid;place-items:center;font-size:.78rem;font-weight:900;flex-shrink:0;
  border:1px solid var(--line)}
.av.me{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.score{font-family:'Oxanium';font-variant-numeric:tabular-nums;font-weight:800;font-size:1.4rem;
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:2px 12px;
  min-width:74px;text-align:center;letter-spacing:.06em;flex-shrink:0}
.score.pending{font-size:.68rem;font-weight:800;font-family:'Cairo';color:var(--ink-3);padding:7px 10px;letter-spacing:0}

/* ===== الترتيب ===== */
.table{width:100%;border-collapse:collapse;font-size:.72rem}
.table th{font-size:.58rem;font-weight:800;color:var(--ink-3);padding:8px 4px;
  border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.table th:nth-child(2){text-align:right}
.table td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.table td:nth-child(2){text-align:right;width:99%}
.table tr:last-child td{border-bottom:none}
.table tr.me{background:var(--gold-soft)}
.rank{font-family:'Oxanium';font-weight:800;font-size:.78rem;width:26px}
.rank.top{color:var(--gold)}
.pl{display:flex;align-items:center;gap:7px;min-width:0}
.pl .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-family:'Oxanium';font-weight:800;font-size:.86rem;color:var(--gold)}
.sgn{direction:ltr;unicode-bidi:isolate;display:inline-block}
.form{display:inline-flex;gap:3px}
.fchip{width:15px;height:15px;border-radius:5px;font-size:.52rem;font-weight:900;
  display:grid;place-items:center;font-family:'Oxanium'}
.fchip.W{background:var(--win-soft);color:var(--win)}
.fchip.D{background:var(--gold-soft);color:var(--gold)}
.fchip.L{background:var(--lose-soft);color:var(--lose)}
.fchip.N{background:var(--surface-2);color:var(--ink-3)}

/* ===== نماذج ===== */
.field{margin-bottom:12px}
.field label{display:block;font-size:.65rem;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;
  padding:10px 12px;font-size:.76rem;font-weight:700;transition:.2s}
.input:focus{outline:none;border-color:var(--gold);background:var(--surface)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:left 14px top 18px,left 9px top 18px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;gap:5px;background:var(--bg-2);padding:4px;border-radius:30px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 6px;border:none;border-radius:30px;background:transparent;
  color:var(--ink-2);font-size:.68rem;font-weight:800;cursor:pointer;transition:.2s}
.seg button.on{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}

/* لوحة إدخال النتيجة */
.entry{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.entry .who{text-align:center;font-size:.7rem;font-weight:800;margin-bottom:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:center;gap:7px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface-2);font-size:1rem;font-weight:800;cursor:pointer;line-height:1;
  display:grid;place-items:center;flex-shrink:0}
.stepper button:active{background:var(--gold-soft);color:var(--gold)}
.stepper input{width:46px;height:42px;text-align:center;font-family:'Oxanium';font-weight:800;
  font-size:1.25rem;background:var(--surface);border:1px solid var(--line-2);border-radius:10px}
.vs{font-family:'Oxanium';font-weight:800;color:var(--ink-3);font-size:.8rem;padding-top:22px}

/* ===== نافذة ===== */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.62);
  backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-2);border-radius:22px 22px 0 0;
  padding:16px 15px calc(20px + env(safe-area-inset-bottom));animation:rise .26s ease}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{font-size:.88rem;font-weight:900;flex:1}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
  cursor:pointer;font-size:1rem;line-height:1;color:var(--ink-2);display:grid;place-items:center;flex-shrink:0}

/* ===== إشعار ===== */
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,20px);
  z-index:100;background:var(--surface-3);border:1px solid var(--line-2);border-radius:30px;
  padding:9px 18px;font-size:.7rem;font-weight:800;opacity:0;pointer-events:none;transition:.28s;
  max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(50%,0)}
.toast.ok{border-color:rgba(159,224,79,.4);color:var(--win)}
.toast.err{border-color:rgba(255,85,102,.4);color:var(--lose)}

/* ===== حالات فارغة ===== */
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty h3{font-size:.82rem;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:.68rem;margin-bottom:14px}

/* ===== شريط الجولات ===== */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
  scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.rbtn{flex-shrink:0;padding:7px 13px;border-radius:30px;border:1px solid var(--line);
  background:var(--surface);font-size:.66rem;font-weight:800;color:var(--ink-2);cursor:pointer;transition:.2s}
.rbtn.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.rbtn.done{color:var(--ink-3)}

/* ===== قائمة اختيار ===== */
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;cursor:pointer;transition:.2s;margin-bottom:7px}
.pick:hover{border-color:var(--gold-line)}
.pick.on{background:var(--gold-soft);border-color:var(--gold-line)}
.pick .nm{font-size:.76rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== إحصاء سريع ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kpi{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center}
.kpi b{display:block;font-family:'Oxanium';font-size:1rem;font-weight:800}
.kpi span{font-size:.56rem;font-weight:800;color:var(--ink-3)}

.evd{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.evd img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line-2);cursor:pointer}
.note{background:var(--bg-2);border:1px solid var(--line);border-right:3px solid var(--gold);
  border-radius:10px;padding:9px 12px;font-size:.68rem;color:var(--ink-2);margin-bottom:11px}
.note.warn{border-right-color:var(--lose)}
.note.violet{border-right-color:var(--violet)}

/* ترويسة صفحة */
.phead{display:flex;align-items:flex-end;gap:10px;margin:2px 0 15px}
.phead h1{font-size:1.15rem;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.phead .sub{font-size:.63rem;color:var(--ink-3);font-weight:700;padding-bottom:3px}
.phead .act{margin-inline-start:auto}

/* شرائط تصفية */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;padding:7px 14px;border-radius:30px;border:1px solid var(--line);
  background:var(--surface);font-size:.67rem;font-weight:800;color:var(--ink-2);cursor:pointer;transition:.2s}
.fbtn.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.fbtn i{font-style:normal;opacity:.6;margin-inline-start:4px}

/* بطاقة بطولة */
.tcard{display:flex;gap:11px;width:100%;text-align:right;background:var(--surface);
  border:1px solid var(--line);border-radius:15px;padding:12px;cursor:pointer;
  transition:.2s;margin-bottom:9px;align-items:center}
.tcard:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.tcard.done{opacity:.78}
.tcard .cup{width:40px;height:46px;flex-shrink:0;display:grid;place-items:center}
.tcard .body{flex:1;min-width:0}
.tcard .ttl{font-size:.84rem;font-weight:900;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
.tcard .facts{display:flex;gap:12px;font-size:.62rem;color:var(--ink-3);font-weight:700}
.tcard .facts b{color:var(--ink-2);font-family:'Oxanium';font-weight:800}
.tcard .go{color:var(--ink-3);font-size:1rem;flex-shrink:0;align-self:center}

/* منتقي نوع البطولة — عربي فوق وإنجليزي تحته */
.seg.col{flex-direction:column;gap:4px;border-radius:14px;padding:5px}
.seg.col button{border-radius:11px;padding:9px 8px;line-height:1.35;text-align:center}
.seg.col button b{display:block;font-size:.74rem;font-weight:900}
.seg.col button i{display:block;font-style:normal;font-size:.58rem;
  font-weight:700;opacity:.65;letter-spacing:.02em}

/* ===== الألعاب الأخرى — قسم ثانوي ===== */
.gcard{display:flex;gap:11px;width:100%;text-align:right;background:var(--surface);
  border:1px solid var(--line);border-radius:15px;padding:12px;cursor:pointer;
  transition:.2s;margin-bottom:9px;align-items:center}
.gcard:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.gico{width:44px;height:44px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;
  font-size:1.5rem;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;padding:2px}
.gico img{display:block}
.ginline{display:inline-block;width:18px;height:18px;vertical-align:-3px}
.gbody{flex:1;min-width:0}
.gname{font-size:.86rem;font-weight:900;line-height:1.3}
.gsub{font-size:.6rem;font-weight:800;color:var(--ink-3);letter-spacing:.04em}

/* إدخال Wins / Kills */
.wkentry{display:flex;gap:10px;align-items:stretch;
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.wkside{flex:1;min-width:0;text-align:center}
.wklab{display:block;font-size:.58rem;font-weight:800;color:var(--ink-3);margin-bottom:5px}

/* ===== الكؤوس — SVG شفاف بلا خلفيات ===== */
.trophy{display:block;width:100%;height:100%;overflow:visible}
.trophy svg{width:100%;height:100%;display:block;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}

/* شريط اليوم */
.daybar{display:flex;align-items:center;gap:9px;margin:18px 0 9px}
.daybar b{font-size:.72rem;font-weight:900}
.daybar .ln{flex:1;height:1px;background:var(--line)}
.daybar .cnt{font-size:.58rem;font-weight:800;color:var(--ink-3)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;gap:10px;width:100%;text-align:right}
.mcard:hover{border-color:var(--line-2)}
.mcard .trn{font-size:.55rem;font-weight:800;color:var(--gold);opacity:.85;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .who{font-size:.76rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .rs{font-family:'Oxanium';font-weight:800;font-size:.95rem;flex-shrink:0;
  background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;min-width:58px;text-align:center}
.mcard .rs.soon{font-family:'Cairo';font-size:.63rem;font-weight:800;color:var(--ink-3);padding:6px 9px}

/* جدول قابل للترتيب */
.sortable th{cursor:pointer;user-select:none;white-space:nowrap}
.sortable th.on{color:var(--gold)}
.sortable th.on::after{content:' ▾';font-size:.5rem}

/* شبكة اختيار الكأس */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.tpick{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;
  cursor:pointer;display:grid;place-items:center;height:78px;transition:.18s}
.tpick.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 1px var(--gold-line)}

/* شجرة البطولة */
.tree{overflow-x:auto;overflow-y:hidden;margin:0 -13px;padding:2px 13px 16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tree::-webkit-scrollbar{height:4px}
.tree-in{display:flex;min-width:min-content;align-items:stretch}
.tr-col{display:flex;flex-direction:column;width:138px;flex-shrink:0;padding:0 10px}
.tr-head{font-size:.56rem;font-weight:800;color:var(--ink-3);text-align:center;
  padding-bottom:9px;letter-spacing:.05em;white-space:nowrap}
.tr-body{flex:1;display:flex;flex-direction:column}
.tr-cell{flex:1;display:flex;align-items:center;position:relative;min-height:56px}
.tr-col:not(:first-of-type) .tr-cell::before{content:'';position:absolute;right:-10px;
  width:10px;top:50%;border-top:1px solid var(--line-2)}
.tr-col:not(:last-of-type) .tr-cell::after{content:'';position:absolute;left:-10px;width:10px;
  border-left:1px solid var(--line-2)}
.tr-cell.up::after{top:50%;bottom:0;border-top:1px solid var(--line-2)}
.tr-cell.dn::after{top:0;height:50%;border-bottom:1px solid var(--line-2)}
.tr-m{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:.18s;text-align:right}
.tr-m:hover{border-color:var(--gold-line)}
.tr-m.live{border-color:rgba(255,59,78,.45)}
.tr-m.bye{background:var(--bg-2);border-style:dashed;cursor:default;opacity:.85}
.tr-tag{font-size:.5rem;font-weight:800;color:var(--ink-3);padding:3px 7px 0;letter-spacing:.04em}
.tr-s{display:flex;align-items:center;gap:6px;padding:5px 7px;font-size:.63rem;font-weight:700}
.tr-s + .tr-s{border-top:1px solid var(--line)}
.tr-s .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-s .g{font-family:'Oxanium';font-weight:800;min-width:15px;text-align:center;color:var(--ink-3);font-size:.68rem}
.tr-s.w{background:var(--gold-soft)}
.tr-s.w .n,.tr-s.w .g{color:var(--gold)}
.tr-s.lo .n,.tr-s.lo .g{color:var(--ink-3)}
.tr-s.tbd .n{color:var(--ink-3);font-weight:600}
.tr-cup{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:120px;flex-shrink:0;padding:0 8px;text-align:center}
.tr-cup .ic{width:44px;height:50px}
.tr-cup .nm{font-size:.76rem;font-weight:900;color:var(--gold);margin-top:6px;
  overflow-wrap:anywhere;line-height:1.4}
.tr-cup .lb{font-size:.55rem;font-weight:800;color:var(--ink-3);letter-spacing:.06em}
.tr-hint{text-align:center;font-size:.58rem;color:var(--ink-3);font-weight:700;margin-top:-8px}

/* رسوم الإحصائيات */
.barrow{display:flex;align-items:center;gap:9px;padding:6px 0}
.barrow .nm{width:74px;flex-shrink:0;font-size:.68rem;font-weight:800;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{flex:1;height:17px;background:var(--bg-2);border-radius:5px;overflow:hidden;
  border:1px solid var(--line)}
.barfill{height:100%;border-radius:4px;background:var(--gold-grad);transition:width .5s ease}
.barfill.red{background:linear-gradient(135deg,#ff7a86,#e03a4c)}
.barfill.dim{background:linear-gradient(135deg,#6f7a68,#48513f)}
.barrow .v{width:38px;flex-shrink:0;text-align:left;font-family:'Oxanium';font-weight:800;
  font-size:.72rem;color:var(--gold)}
.barrow .v.red{color:var(--lose)}
.barrow .v.dim{color:var(--ink-2)}
.tabs{display:flex;gap:5px;background:var(--bg-2);padding:4px;border-radius:30px;
  border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;padding:8px 6px;border:none;border-radius:30px;background:transparent;
  color:var(--ink-2);font-size:.68rem;font-weight:800;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}

/* ============================================================
   ★ غرفة المباراة — Match Room
   ============================================================ */
.mr-head{display:flex;align-items:center;gap:9px;margin:2px 0 13px}
.mr-head .back{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;
  font-size:1rem;cursor:pointer;flex-shrink:0;text-decoration:none}
.mr-head .ttl{flex:1;min-width:0}
.mr-head .ttl b{display:block;font-size:.86rem;font-weight:900;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-head .ttl span{font-size:.6rem;color:var(--ink-3);font-weight:800}
/* زر الإدارة — معزول تمامًا في الترويسة، بعيد عن الدردشة */
.mr-admin{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink-2);font-size:1.1rem;line-height:1;
  cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.mr-admin:hover{border-color:var(--gold-line);color:var(--gold)}

/* بطاقة الجاهزية */
.ready{display:flex;gap:9px;margin-bottom:11px}
.ready .p{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
  padding:10px 6px;text-align:center;min-width:0}
.ready .p.on{border-color:rgba(159,224,79,.4);background:var(--win-soft)}
.ready .p .nm{font-size:.7rem;font-weight:800;margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ready .p .st{font-size:.6rem;font-weight:800;color:var(--ink-3)}
.ready .p.on .st{color:var(--win)}

/* دردشة */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);
  background:var(--bg-2)}
.chat-head b{font-size:.74rem;font-weight:900;flex:1}
.chat-log{max-height:320px;overflow-y:auto;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:82%;padding:7px 12px;border-radius:14px;font-size:.74rem;line-height:1.65;
  align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-bottom-right-radius:5px}
.msg.mine{align-self:flex-end;background:var(--gold-soft);border-color:var(--gold-line);
  border-bottom-right-radius:14px;border-bottom-left-radius:5px}
.msg .who{font-size:.58rem;font-weight:800;color:var(--ink-3);margin-bottom:2px}
.msg time{display:block;font-size:.54rem;color:var(--ink-3);font-family:'Oxanium';margin-top:3px;
  text-align:left}
.chat-shut{padding:20px 14px;text-align:center;color:var(--ink-3);font-size:.7rem;line-height:1.9}
.chat-shut b{display:block;color:var(--ink-2);font-weight:800;font-size:.74rem;margin-bottom:3px}

/* رسالة صوتية */
.vmsg{display:flex;align-items:center;gap:9px;min-width:150px}
.vplay{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);font-size:.8rem;cursor:pointer;
  display:grid;place-items:center;flex-shrink:0}
.msg.mine .vplay{background:var(--gold);color:#0d1004;border-color:transparent}
.vwave{flex:1;height:20px;display:flex;align-items:center;gap:2px;overflow:hidden}
.vwave i{flex:1;background:currentColor;opacity:.4;border-radius:2px;min-width:2px}
.vdur{font-family:'Oxanium';font-size:.6rem;font-weight:800;color:var(--ink-3);flex-shrink:0}

/* رسائل سريعة */
.quick{display:flex;gap:6px;overflow-x:auto;padding:9px 11px;border-top:1px solid var(--line);
  background:var(--bg-2);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex-shrink:0;padding:6px 12px;border-radius:30px;border:1px solid var(--line-2);
  background:var(--surface);font-size:.66rem;font-weight:800;color:var(--ink-2);
  cursor:pointer;transition:.18s;white-space:nowrap}
.qbtn:hover,.qbtn:active{border-color:var(--gold-line);color:var(--gold)}

/* ★ شريط الإرسال — زر إرسال واضح وكبير */
.chat-bar{padding:10px 11px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg-2)}
.chat-bar input{width:100%;background:var(--surface);border:1px solid var(--line-2);
  border-radius:12px;padding:11px 14px;font-size:.78rem;font-weight:600;margin-bottom:8px}
.chat-bar input:focus{outline:none;border-color:var(--gold)}
.chat-acts{display:flex;gap:8px}
.imgbtn{width:44px;height:44px;flex-shrink:0;border-radius:12px;
  border:1px solid var(--line-2);background:var(--surface);
  font-size:1.1rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.imgbtn:hover{border-color:var(--gold-line)}
.imgbtn:active{transform:scale(.95)}
.msg.imgmsg{padding:5px 5px 3px}
.cimg{position:relative;min-width:130px;min-height:80px;border-radius:10px;
  overflow:hidden;background:var(--bg-2);cursor:pointer;display:block}
.cimg img{display:block;width:100%;max-width:220px;max-height:260px;
  object-fit:cover;border-radius:10px}
.cimg .ld{position:absolute;inset:0;display:grid;place-items:center;
  font-size:.6rem;font-weight:800;color:var(--ink-3)}
.mic{flex:1;height:44px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:.74rem;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  user-select:none;-webkit-user-select:none;touch-action:none;transition:.15s}
.mic.rec{background:var(--live-soft);border-color:rgba(255,59,78,.45);color:var(--live)}
.send{flex:1.35;height:44px;border-radius:12px;border:none;background:var(--gold-grad);
  color:#0d1004;font-size:.82rem;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px}
.send:disabled{opacity:.4;cursor:not-allowed}
.reclive{display:flex;align-items:center;justify-content:center;gap:9px;height:44px;
  border-radius:12px;background:var(--live-soft);border:1px solid rgba(255,59,78,.45);
  color:var(--live);font-size:.74rem;font-weight:800}
.reclive .t{font-family:'Oxanium';font-weight:800}

/* شاشة الانتظار */
.wait{text-align:center;padding:30px 14px 10px}
.wait-mark{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;
  background:var(--gold-soft);border:1px solid var(--gold-line);
  display:grid;place-items:center;position:relative}
.wait-mark span{font-family:'Oxanium';font-weight:800;font-size:1.05rem;color:var(--gold)}
.wait-mark::after{content:'';position:absolute;inset:-1px;border-radius:20px;
  border:1px solid var(--gold);opacity:0;animation:halo 2.8s ease-out infinite}
@keyframes halo{0%{opacity:.5;transform:scale(1)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0}}
.wait h3{font-size:1rem;font-weight:900;margin-bottom:6px}
.wait p{font-size:.72rem;color:var(--ink-2);max-width:290px;margin:0 auto;line-height:1.9}
.steps{margin:26px auto 0;max-width:330px;text-align:right}
.step{display:flex;align-items:flex-start;gap:11px;position:relative;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step::before{content:'';position:absolute;top:22px;bottom:2px;right:10px;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.step i{width:21px;height:21px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:.6rem;font-weight:900;font-style:normal;z-index:1;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-3)}
.step.done i{background:var(--win-soft);border-color:rgba(159,224,79,.4);color:var(--win)}
.step.now i{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold);
  animation:pulse-g 1.9s infinite}
@keyframes pulse-g{0%{box-shadow:0 0 0 0 rgba(216,229,81,.4)}70%{box-shadow:0 0 0 8px rgba(216,229,81,0)}100%{box-shadow:0 0 0 0 rgba(216,229,81,0)}}
.step b{display:block;font-size:.74rem;font-weight:800;line-height:1.5}
.step.pending b{color:var(--ink-3)}
.step small{display:block;font-size:.63rem;color:var(--ink-3);font-weight:600}
.step.now b{color:var(--gold)}

.foot{text-align:center;padding:26px 0 8px;color:var(--ink-3);font-size:.58rem;
  font-weight:800;letter-spacing:.06em;user-select:none;cursor:default}
.log{font-size:.64rem;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log:last-child{border:none}
.log time{color:var(--ink-3);font-family:'Oxanium';flex-shrink:0}
</style>
</head>

/* ─────────── 2) أدوات ─────────── */
const U = {
  uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); },
  uuid(){
    return crypto.randomUUID ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
  },
  today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:CFG.TZ}).format(new Date()); },
  nowISO(){ return new Date().toISOString(); },
  addDays(iso, n){
    const [y,m,d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m-1, d));
    t.setUTCDate(t.getUTCDate() + n);
    return t.toISOString().slice(0,10);
  },
  diffDays(a,b){
    const p = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
    return Math.round((p(b)-p(a))/86400000);
  },
  dayName(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  },
  fmtDate(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-').map(Number);
    const mo = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][m-1];
    const t = U.today();
    if(iso === t) return 'اليوم';
    if(iso === U.addDays(t,1)) return 'غداً';
    if(iso === U.addDays(t,-1)) return 'أمس';
    return `${U.dayName(iso)} ${d} ${mo}`;
  },
  fmtTime(hm){
    if(!hm) return '';
    let [h,m] = hm.split(':').map(Number);
    const ap = h >= 12 ? 'م' : 'ص';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ap}`;
  },
  fmtStamp(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const day = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.TZ}).format(d);
    const tm = new Intl.DateTimeFormat('en-GB',{timeZone:CFG.TZ,hour:'2-digit',minute:'2-digit'}).format(d);
    return `${U.fmtDate(day)} · ${U.fmtTime(tm)}`;
  },
  matchMoment(m){ return new Date(`${m.match_date}T${(m.match_time||'21:00').slice(0,5)}:00+03:00`); },
  mins(ms){ return Math.round(ms/60000); },
  humanWait(mins){
    if(mins < 60) return `${mins} دقيقة`;
    const h = Math.floor(mins/60), d = Math.floor(h/24);
    if(h < 24) return `${h} ساعة`;
    return `${d} يوم`;
  },
  clock(ms){
    const s = Math.floor(ms/1000);
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  initials(name){ return String(name||'؟').trim().charAt(0); }
};

/* ─────────── 3) طبقة البيانات — Supabase ─────────── */
const Store = {
  sb: null, configured: false,
  session: null, profile: null, myPlayer: null,
  settings: { fc_version: '27' },
  cache: { tournaments: [], players: [], entries: {}, matches: {}, audit: {} },
  db: { meta: { activeTournament: null } },

  async init(){
    if(!CFG.SB.URL || CFG.SB.URL.indexOf('ضع-') === 0 || !CFG.SB.KEY || CFG.SB.KEY.indexOf('ضع-') === 0){
      this.configured = false; return;
    }
    this.sb = supabase.createClient(CFG.SB.URL, CFG.SB.KEY);
    this.configured = true;
    const { data } = await this.sb.auth.getSession();
    this.session = data.session || null;
    this.sb.auth.onAuthStateChange(async (_e, s) => {
      this.session = s || null;
      await this.loadIdentity();
      await this.refreshBase();
      await this.refreshAll();
      UI.render();
    });
    await this.loadSettings();
    await this.loadIdentity();
    await this.refreshBase();
    await this.refreshAll();
    const saved = localStorage.getItem(CFG.KEY + '_active');
    this.db.meta.activeTournament =
      (saved && this.cache.tournaments.some(t => t.id === saved))
        ? saved : (this.cache.tournaments[0]?.id || null);
  },

  /* إصدار FC يُقرأ من القاعدة — يغيّره المشرف بلا تعديل كود */
  async loadSettings(){
    const { data } = await this.sb.from('app_settings').select('*').eq('id',1).maybeSingle();
    if(data){
      this.settings = data;
      if(data.fc_version) CFG.BRAND.version = String(data.fc_version);
    }
  },
  async setVersion(v){
    const { error } = await this.sb.from('app_settings')
      .update({ fc_version: String(v).trim(), updated_at: U.nowISO(), updated_by: this.session?.user?.id })
      .eq('id', 1);
    if(error) throw new Error(this._err(error));
    CFG.BRAND.version = String(v).trim();
    this.settings.fc_version = CFG.BRAND.version;
  },

  _err(e){
    const raw = e?.message || String(e);
    const map = {
      'Invalid login credentials': 'اسم المستخدم أو كلمة المرور غير صحيحة',
      'User already registered': 'اسم المستخدم مستخدم من قبل',
      'Password should be at least 6 characters': 'كلمة المرور يجب ألا تقل عن 6 أحرف',
      'Email not confirmed': 'تأكيد البريد مفعّل في Supabase — عطّله من إعدادات المصادقة'
    };
    for(const k in map) if(raw.includes(k)) return map[k];
    if(raw.includes('row-level security')) return 'ليست لديك صلاحية لهذا الإجراء';
    if(raw.includes('Failed to fetch')) return 'تعذّر الاتصال بالخادم';
    return raw;
  },

  /* — الهوية — */
  async loadIdentity(){
    this.profile = null; this.myPlayer = null;
    if(!this.session) return;
    const { data: pr } = await this.sb.from('profiles')
      .select('*').eq('id', this.session.user.id).maybeSingle();
    this.profile = pr || null;
    const { data: pl } = await this.sb.from('players')
      .select('*').eq('profile_id', this.session.user.id).maybeSingle();
    this.myPlayer = pl || null;
  },

  get me(){ return this.myPlayer?.id || null; },
  get isAdmin(){ return !!this.profile?.is_admin; },
  get isGuest(){ return !this.session; },

  _email(username){ return String(username).trim().toLowerCase() + '@' + CFG.MAIL_DOMAIN; },

  async signUp(username, password, displayName){
    const u = String(username||'').trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(u))
      throw new Error('اسم المستخدم: 3–20 حرفاً إنجليزياً أو رقماً أو شرطة سفلية');
    if(String(password||'').length < 6) throw new Error('كلمة المرور يجب ألا تقل عن 6 أحرف');
    const { error } = await this.sb.auth.signUp({
      email: this._email(u), password,
      options: { data: { username: u, display_name: String(displayName||'').trim() || u } }
    });
    if(error) throw new Error(this._err(error));
    if(!(await this.sb.auth.getSession()).data.session) await this.signIn(u, password);
  },
  async signIn(username, password){
    const { error } = await this.sb.auth.signInWithPassword({
      email: this._email(username), password
    });
    if(error) throw new Error(this._err(error));
  },
  async signOut(){ await this.sb.auth.signOut(); },

  async claimPlayer(playerId){
    const { error } = await this.sb.rpc('claim_player', { p_player: playerId });
    if(error) throw new Error(this._err(error));
    await this.loadIdentity(); await this.refreshBase();
  },
  async createMyPlayer(name){
    const { error } = await this.sb.rpc('create_my_player', { p_name: name });
    if(error) throw new Error(this._err(error));
    await this.loadIdentity(); await this.refreshBase();
  },

  /* — التحميل — */
  async refreshBase(){
    const [t, p] = await Promise.all([
      this.sb.from('tournaments').select('*').order('created_at', { ascending:false }),
      this.sb.from('players').select('*').order('name')
    ]);
    if(!t.error) this.cache.tournaments = t.data || [];
    if(!p.error) this.cache.players = p.data || [];
  },

  async refreshAll(){
    const [e, m] = await Promise.all([
      this.sb.from('entries').select('*'),
      this.sb.from('matches').select('*').order('round').order('match_date')
    ]);
    if(e.error || m.error){ console.error('refreshAll', e.error || m.error); return false; }
    const ent = {}, mat = {};
    this.cache.tournaments.forEach(t => { ent[t.id] = []; mat[t.id] = []; });
    (e.data || []).forEach(r => (ent[r.tournament_id] = ent[r.tournament_id] || []).push(r));
    (m.data || []).forEach(r => (mat[r.tournament_id] = mat[r.tournament_id] || []).push(r));
    this.cache.entries = ent;
    this.cache.matches = mat;
    this._loadedAll = true;
    return true;
  },

  async refreshAudit(tid){
    if(!tid) return;
    const { data, error } = await this.sb.from('audit_log').select('*')
      .eq('tournament_id', tid).order('created_at', { ascending:false }).limit(120);
    if(!error) this.cache.audit[tid] = data || [];
  },

  async refreshTournament(tid){
    if(!tid) return;
    const [e, m] = await Promise.all([
      this.sb.from('entries').select('*').eq('tournament_id', tid),
      this.sb.from('matches').select('*').eq('tournament_id', tid).order('round').order('match_date')
    ]);
    if(!e.error) this.cache.entries[tid] = e.data || [];
    if(!m.error) this.cache.matches[tid] = m.data || [];
    await this.refreshAudit(tid);
  },

  async syncActive(){
    if(!this._loadedAll) await this.refreshAll();
    const tid = this.db.meta.activeTournament;
    if(tid && !this.cache.audit[tid]) await this.refreshAudit(tid);
  },
  async reload(){
    await this.refreshBase(); await this.refreshAll();
    await this.refreshAudit(this.db.meta.activeTournament);
  },

  /* ── قراءات شاملة (مقيّدة بنطاق اللعبة عند الحاجة) ── */
  allMatches(){ return Object.values(this.cache.matches).flat(); },
  allEntries(){ return Object.values(this.cache.entries).flat(); },
  /* معرّفات بطولات لعبة معيّنة — أساس فصل الإحصائيات بين الألعاب */
  gameTournamentIds(game){
    return this.cache.tournaments.filter(t => (t.game || 'fc') === game).map(t => t.id);
  },
  gameMatches(game){
    const ids = new Set(this.gameTournamentIds(game));
    return this.allMatches().filter(m => ids.has(m.tournament_id));
  },
  gameEntries(game){
    const ids = new Set(this.gameTournamentIds(game));
    return this.allEntries().filter(e => ids.has(e.tournament_id));
  },
  gameOf(tid){
    return (this.cache.tournaments.find(t => t.id === tid)?.game) || 'fc';
  },
  scoringOf(tid){
    return CFG.GAMES[this.gameOf(tid)]?.scoring || 'goals';
  },
  matchesOf(playerId){
    return this.allMatches().filter(m => m.player_a === playerId || m.player_b === playerId);
  },
  tournamentsOf(playerId){
    return this.allEntries().filter(e => e.player_id === playerId).map(e => e.tournament_id);
  },

  /* — البطولات — */
  async tournaments(){ return this.cache.tournaments; },
  async tournament(id){ return this.cache.tournaments.find(t=>t.id===id) || null; },
  async activeTournament(){ return this.tournament(this.db.meta.activeTournament); },
  async setActiveTournament(id){
    this.db.meta.activeTournament = id;
    localStorage.setItem(CFG.KEY + '_active', id || '');
    await this.refreshTournament(id);
    this.watch(id);
  },
  async createTournament(data){
    const { data: row, error } = await this.sb.from('tournaments').insert({
      name: data.name,
      game: data.game || 'fc',
      game_version: data.game === 'fc' || !data.game ? CFG.BRAND.version : null,
      kind: data.kind || 'league',
      trophy: Number(data.trophy) || 1,
      join_mode: data.join_mode || 'open',
      format: data.format || 'double',
      start_date: data.start_date, end_date: data.end_date || null,
      gap_days: Number(data.gap_days) || 2,
      points: data.points || null,
      match_time: data.match_time || CFG.DEFAULT_TIME
    }).select().single();
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
    this.cache.entries[row.id] = this.cache.entries[row.id] || [];
    this.cache.matches[row.id] = this.cache.matches[row.id] || [];
    await this.log(row.id, null, 'إنشاء بطولة', row.name);
    return row;
  },
  async updateTournament(id, patch){
    const { error } = await this.sb.from('tournaments').update(patch).eq('id', id);
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
  },
  async deleteTournament(id){
    const { error } = await this.sb.from('tournaments').delete().eq('id', id);
    if(error) throw new Error(this._err(error));
    delete this.cache.entries[id]; delete this.cache.matches[id]; delete this.cache.audit[id];
    await this.refreshBase();
    if(this.db.meta.activeTournament === id)
      await this.setActiveTournament(this.cache.tournaments[0]?.id || null);
  },

  /* — اللاعبون — */
  async players(){ return this.cache.players; },
  async player(id){ return this.cache.players.find(p=>p.id===id) || null; },
  async createPlayer(name){
    const nm = String(name||'').trim();
    if(!nm) return null;
    const dup = this.cache.players.find(p=>p.name === nm);
    if(dup) return dup;
    const { data, error } = await this.sb.from('players').insert({ name:nm }).select().single();
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
    return data;
  },
  async updatePlayer(id, patch){
    const { error } = await this.sb.from('players').update(patch).eq('id', id);
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
  },
  async updateMyPlayer(name, gameId, platform){
    const { error } = await this.sb.rpc('update_my_player', {
      p_name: name || null, p_game_id: gameId || null, p_platform: platform || null
    });
    if(error) throw new Error(this._err(error));
    await this.loadIdentity(); await this.refreshBase();
  },

  /* — طلبات الانضمام — */
  async openTournaments(){
    return this.cache.tournaments.filter(t => t.status === 'draft' && t.join_mode !== 'closed');
  },
  async myRequests(){
    if(!this.me) return [];
    const { data } = await this.sb.from('join_requests').select('*').eq('player_id', this.me);
    return data || [];
  },
  async pendingRequests(tid){
    const { data } = await this.sb.from('join_requests')
      .select('*').eq('tournament_id', tid).eq('status','pending').order('created_at');
    return (data || []).map(r => ({ ...r, player: this.cache.players.find(p=>p.id===r.player_id) }));
  },
  async requestJoin(tid){
    const { data, error } = await this.sb.rpc('request_join', { p_tournament: tid });
    if(error) throw new Error(this._err(error));
    await this.refreshTournament(tid);
    return data;
  },
  async decideJoin(reqId, approve){
    const { error } = await this.sb.rpc('decide_join', { p_request: reqId, p_approve: approve });
    if(error) throw new Error(this._err(error));
    await this.refreshTournament(this.db.meta.activeTournament);
  },

  /* — المشرفون — */
  async profiles(){
    const { data } = await this.sb.from('profiles').select('*').order('display_name');
    return data || [];
  },
  async setProfileAdmin(id, on){
    const { error } = await this.sb.from('profiles').update({ is_admin: on }).eq('id', id);
    if(error) throw new Error(this._err(error));
    if(id === this.session?.user?.id) await this.loadIdentity();
  },

  /* — مواعيد الجولات — */
  async setRoundSchedule(tid, round, date, time){
    const patch = {};
    if(date) patch.match_date = date;
    if(time) patch.match_time = time;
    const { error } = await this.sb.from('matches').update(patch)
      .eq('tournament_id', tid).eq('round', round)
      .in('status', ['scheduled','live','pending_confirmation','postponed']);
    if(error) throw new Error(this._err(error));
  },

  /* — المشاركون — */
  async entries(tid){
    return (this.cache.entries[tid] || [])
      .map(e => ({ ...e, player: this.cache.players.find(p=>p.id===e.player_id) }))
      .filter(e => e.player);
  },
  async setEntries(tid, playerIds){
    const cur = (this.cache.entries[tid] || []).map(e=>e.player_id);
    const add = playerIds.filter(id => !cur.includes(id));
    const del = cur.filter(id => !playerIds.includes(id));
    if(del.length){
      const { error } = await this.sb.from('entries').delete()
        .eq('tournament_id', tid).in('player_id', del);
      if(error) throw new Error(this._err(error));
    }
    if(add.length){
      const { error } = await this.sb.from('entries')
        .insert(add.map(pid => ({ tournament_id: tid, player_id: pid })));
      if(error) throw new Error(this._err(error));
    }
    await this.refreshTournament(tid);
  },

  /* — المباريات — */
  async matches(tid){ return this.cache.matches[tid] || []; },
  async match(id){
    for(const tid in this.cache.matches){
      const m = this.cache.matches[tid].find(x=>x.id===id);
      if(m) return m;
    }
    const { data } = await this.sb.from('matches').select('*').eq('id', id).maybeSingle();
    return data || null;
  },
  async saveMatches(list){
    for(let i=0; i<list.length; i+=100){
      const { error } = await this.sb.from('matches').insert(list.slice(i, i+100));
      if(error) throw new Error(this._err(error));
    }
    await this.refreshTournament(list[0]?.tournament_id);
  },
  async clearMatches(tid){
    const { error } = await this.sb.from('matches').delete().eq('tournament_id', tid);
    if(error) throw new Error(this._err(error));
    await this.refreshTournament(tid);
  },
  async updateMatch(id, patch){
    const { data, error } = await this.sb.from('matches').update(patch).eq('id', id).select().single();
    if(error) throw new Error(this._err(error));
    const arr = this.cache.matches[data.tournament_id];
    if(arr){ const i = arr.findIndex(m=>m.id===id); if(i>-1) arr[i] = data; }
    return data;
  },

  /* — الأدلة الدائمة (لا تُحذف مع تنظيف الدردشة) — */
  async evidence(matchId){
    const { data } = await this.sb.from('match_evidence')
      .select('id,image').eq('match_id', matchId).order('created_at');
    return data || [];
  },
  async addEvidence(matchId, images){
    if(!images.length) return;
    const { error } = await this.sb.from('match_evidence')
      .insert(images.map(img => ({ match_id: matchId, image: img, uploaded_by: this.me })));
    if(error) throw new Error(this._err(error));
  },

  /* — دردشة المباراة (مؤقتة — تُحذف تلقائياً عند اعتماد النتيجة) — */
  async messages(matchId){
    const { data, error } = await this.sb.from('match_messages')
      .select('*').eq('match_id', matchId).order('created_at');
    if(error) return [];
    return data || [];
  },
  async sendMessage(matchId, body){
    const { error } = await this.sb.from('match_messages')
      .insert({ match_id: matchId, player_id: this.me, kind: 'text', body: body.trim() });
    if(error){
      if(String(error.message).includes('row-level security'))
        throw new Error('الدردشة مغلقة الآن');
      throw new Error(this._err(error));
    }
  },

  /* رسالة صوتية: ترفع الملف إلى Storage ثم تسجّل صفاً يشير إليه.
     الحذف التلقائي في القاعدة يمسح الصف ويضع المسار في طابور حذف الملف. */
  async sendVoice(matchId, blob, durationMs){
    const path = `${matchId}/${U.uuid()}.webm`;
    const up = await this.sb.storage.from('match-voice')
      .upload(path, blob, { contentType: blob.type || 'audio/webm', upsert: false });
    if(up.error) throw new Error(this._err(up.error));
    const { error } = await this.sb.from('match_messages').insert({
      match_id: matchId, player_id: this.me, kind: 'voice',
      audio_path: path, duration_ms: Math.round(durationMs)
    });
    if(error){
      await this.sb.storage.from('match-voice').remove([path]);  // تنظيف فوري عند الفشل
      if(String(error.message).includes('row-level security'))
        throw new Error('الدردشة مغلقة الآن');
      throw new Error(this._err(error));
    }
  },
  _voiceUrls: {},
  async voiceUrl(path){
    if(this._voiceUrls[path]) return this._voiceUrls[path];
    const { data, error } = await this.sb.storage.from('match-voice').createSignedUrl(path, 3600);
    if(error) return null;
    this._voiceUrls[path] = data.signedUrl;
    return data.signedUrl;
  },
  /* صورة دردشة مؤقتة — تُحذف تلقائياً مع الدردشة عند اعتماد النتيجة.
     تختلف عن match_evidence وهو دليل دائم لا يُحذف. */
  async sendImage(matchId, blob){
    const path = `${matchId}/${U.uuid()}.jpg`;
    const up = await this.sb.storage.from('match-image')
      .upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if(up.error) throw new Error(this._err(up.error));
    const { error } = await this.sb.from('match_messages').insert({
      match_id: matchId, player_id: this.me, kind: 'image', image_path: path
    });
    if(error){
      await this.sb.storage.from('match-image').remove([path]);
      if(String(error.message).includes('row-level security'))
        throw new Error('الدردشة مغلقة الآن');
      throw new Error(this._err(error));
    }
  },
  _imgUrls: {},
  async imageUrl(path){
    if(this._imgUrls[path]) return this._imgUrls[path];
    const { data, error } = await this.sb.storage.from('match-image').createSignedUrl(path, 3600);
    if(error) return null;
    this._imgUrls[path] = data.signedUrl;
    return data.signedUrl;
  },

  async deleteMessage(id){
    const { error } = await this.sb.from('match_messages').delete().eq('id', id);
    if(error) throw new Error(this._err(error));
  },

  _chatChan: null,
  watchChat(matchId, cb){
    this.unwatchChat();
    if(!matchId || !this.session) return;
    this._chatChan = this.sb.channel('chat_' + matchId)
      .on('postgres_changes',
          { event:'INSERT', schema:'public', table:'match_messages',
            filter:'match_id=eq.'+matchId }, cb)
      .subscribe();
  },
  unwatchChat(){
    if(this._chatChan){ this.sb.removeChannel(this._chatChan); this._chatChan = null; }
  },

  /* — سجل التدقيق — */
  async log(tid, mid, action, detail){
    if(!this.session) return;
    const actor = this.isAdmin ? 'الإدارة'
      : (this.myPlayer?.name || this.profile?.display_name || 'لاعب');
    await this.sb.from('audit_log').insert({
      tournament_id: tid, match_id: mid, actor_name: actor,
      action, detail: detail || null
    });
    if(tid){
      const { data } = await this.sb.from('audit_log').select('*')
        .eq('tournament_id', tid).order('created_at',{ascending:false}).limit(120);
      this.cache.audit[tid] = data || [];
    }
  },
  async auditLog(tid, mid){
    const all = this.cache.audit[tid] || [];
    return mid ? all.filter(a => a.match_id === mid) : all;
  },

  /* — التحديث اللحظي — */
  _chan: null,
  watch(tid){
    if(this._chan){ this.sb.removeChannel(this._chan); this._chan = null; }
    if(!tid) return;
    this._chan = this.sb.channel('m_' + tid)
      .on('postgres_changes',
          { event:'*', schema:'public', table:'matches', filter:'tournament_id=eq.'+tid },
          () => {
            clearTimeout(this._deb);
            this._deb = setTimeout(async () => {
              await this.refreshTournament(tid);
              UI.render();
            }, 400);
          })
      .subscribe();
  }
};
