/* ─────────── 5) المحرّك — دوال نقية ───────────
   لا تلمس DOM ولا التخزين. مدخلاتها مباريات ولاعبون فقط. */
const Engine = {

  /* توليد الجدول بطريقة الدائرة (Berger) */
  fixtures(ids, double){
    const p = ids.slice();
    if(p.length % 2) p.push(null);
    const n = p.length, legs = [];
    for(let r=0; r<n-1; r++){
      const pairs = [];
      for(let i=0; i<n/2; i++){
        const a = p[i], b = p[n-1-i];
        if(a && b) pairs.push(r % 2 ? [b,a] : [a,b]);
      }
      legs.push(pairs);
      p.splice(1, 0, p.pop());
    }
    if(double) legs.push(...legs.map(rd => rd.map(([a,b]) => [b,a])));
    return legs;
  },

  isCounted(m){ return m.status === 'completed'; },

  standings(matches, entries, pts){
    const P = pts || CFG.POINTS;
    const rows = {};
    entries.forEach(e => {
      rows[e.player_id] = { id:e.player_id, name:e.player.name,
        pld:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, wo:0 };
    });
    matches.filter(Engine.isCounted).forEach(m => {
      const A = rows[m.player_a], B = rows[m.player_b];
      if(!A || !B) return;
      const sa = Number(m.score_a), sb = Number(m.score_b);
      A.pld++; B.pld++;
      A.gf += sa; A.ga += sb; B.gf += sb; B.ga += sa;
      if(m.result_type === 'walkover'){ A.wo++; B.wo++; }
      if(sa > sb){ A.w++; B.l++; A.pts += P.win; B.pts += P.loss; }
      else if(sa < sb){ B.w++; A.l++; B.pts += P.win; A.pts += P.loss; }
      else { A.d++; B.d++; A.pts += P.draw; B.pts += P.draw; }
    });
    const list = Object.values(rows);
    list.forEach(r => r.gd = r.gf - r.ga);
    list.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.name.localeCompare(b.name,'ar'));

    const out = [];
    let i = 0;
    while(i < list.length){
      let j = i;
      while(j+1 < list.length && list[j+1].pts===list[i].pts
            && list[j+1].gd===list[i].gd && list[j+1].gf===list[i].gf) j++;
      const grp = list.slice(i, j+1);
      if(grp.length > 1) Engine._h2hSort(grp, matches, P);
      out.push(...grp);
      i = j + 1;
    }
    out.forEach((r,idx)=> r.rank = idx + 1);
    return out;
  },

  _h2hSort(group, matches, P){
    const ids = group.map(r=>r.id);
    const mini = {};
    ids.forEach(id => mini[id] = { pts:0, gd:0, gf:0 });
    matches.filter(Engine.isCounted)
      .filter(m => ids.includes(m.player_a) && ids.includes(m.player_b))
      .forEach(m => {
        const sa = Number(m.score_a), sb = Number(m.score_b);
        mini[m.player_a].gf += sa; mini[m.player_a].gd += sa - sb;
        mini[m.player_b].gf += sb; mini[m.player_b].gd += sb - sa;
        if(sa > sb) mini[m.player_a].pts += P.win;
        else if(sb > sa) mini[m.player_b].pts += P.win;
        else { mini[m.player_a].pts += P.draw; mini[m.player_b].pts += P.draw; }
      });
    group.sort((a,b)=> mini[b.id].pts - mini[a.id].pts
      || mini[b.id].gd - mini[a.id].gd || mini[b.id].gf - mini[a.id].gf
      || b.w - a.w || a.name.localeCompare(b.name,'ar'));
  },

  form(matches, pid, n){
    return matches.filter(Engine.isCounted)
      .filter(m => m.player_a===pid || m.player_b===pid)
      .sort((a,b)=> (b.result_at||'').localeCompare(a.result_at||'') || b.round - a.round)
      .slice(0, n || 5)
      .map(m => {
        const mine = m.player_a===pid ? Number(m.score_a) : Number(m.score_b);
        const his  = m.player_a===pid ? Number(m.score_b) : Number(m.score_a);
        return mine > his ? 'W' : mine < his ? 'L' : 'D';
      });
  },

  seedOrder(size){
    let a = [1];
    while(a.length < size){
      const n = a.length * 2 + 1;
      a = a.flatMap(x => [x, n - x]);
    }
    return a;
  },

  bracket(ids, newId){
    const n = ids.length;
    let size = 1; while(size < n) size *= 2;
    const rounds = Math.log2(size);
    const slots = this.seedOrder(size).map(seed => ids[seed - 1] || null);

    const grid = [];
    for(let r = 0; r < rounds; r++)
      grid.push(Array.from({length: size / Math.pow(2, r + 1)}, () => ({ id:newId(), a:null, b:null })));

    const skipped = new Set();
    for(let j = 0; j < grid[0].length; j++){
      const a = slots[j*2], b = slots[j*2 + 1];
      if(a && b){ grid[0][j].a = a; grid[0][j].b = b; }
      else {
        const passer = a || b;
        skipped.add(j);
        if(passer && rounds > 1) grid[1][Math.floor(j/2)][j % 2 === 0 ? 'a' : 'b'] = passer;
      }
    }

    const out = [];
    for(let r = 0; r < rounds; r++){
      for(let j = 0; j < grid[r].length; j++){
        if(r === 0 && skipped.has(j)) continue;
        const nx = r + 1 < rounds ? grid[r+1][Math.floor(j/2)] : null;
        out.push({
          id: grid[r][j].id, round: r + 1, slot: j,
          player_a: grid[r][j].a, player_b: grid[r][j].b,
          next_match_id: nx ? nx.id : null,
          next_slot: nx ? (j % 2 === 0 ? 'a' : 'b') : null
        });
      }
    }
    return { matches: out, rounds, size, byes: size - n };
  },

  roundName(matchesInRound){
    return { 1:'النهائي', 2:'نصف النهائي', 4:'ربع النهائي',
             8:'ثمن النهائي', 16:'دور الـ32', 32:'دور الـ64' }[matchesInRound]
           || `دور الـ${matchesInRound * 2}`;
  },
  roundLabel(round, matches){
    const last = matches.reduce((x,m)=> Math.max(x, m.round), 1);
    return this.roundName(Math.pow(2, last - round));
  },

  winnerOf(m){
    if(m.status !== 'completed') return null;
    if(m.score_a > m.score_b) return m.player_a;
    if(m.score_b > m.score_a) return m.player_b;
    if(m.pen_a != null && m.pen_b != null){
      if(m.pen_a > m.pen_b) return m.player_a;
      if(m.pen_b > m.pen_a) return m.player_b;
    }
    return null;
  },

  treeShape(matches){
    if(!matches.length) return null;
    const last = matches.reduce((x,m)=> Math.max(x, m.round), 1);
    const size = Math.pow(2, last);
    const at = (r, slot) => matches.find(m => m.round === r && m.slot === slot) || null;

    const cols = [];
    for(let r = 1; r <= last; r++){
      const count = size / Math.pow(2, r);
      const cells = [];
      for(let j = 0; j < count; j++){
        const m = at(r, j);
        if(m){ cells.push({ type:'match', m }); continue; }
        let passer = null;
        if(r === 1 && last > 1){
          const nx = at(2, Math.floor(j/2));
          if(nx) passer = j % 2 === 0 ? nx.player_a : nx.player_b;
        }
        cells.push({ type:'bye', player: passer });
      }
      cols.push({ round:r, name: Engine.roundName(count), cells });
    }
    return { cols, size, rounds:last };
  },

  isFinished(matches){
    if(!matches.length) return false;
    return matches.every(m => ['completed','cancelled'].includes(m.status));
  },

  titleHolder(t, matches, entries){
    if(!matches.length) return null;
    if(t.kind === 'knockout') return this.champion(matches);
    if(!this.isFinished(matches)) return null;
    const tb = this.standings(matches, entries, t.points);
    return tb.length && tb[0].pld > 0 ? tb[0].id : null;
  },

  /* ══════════════════════════════════════════════════
     محرّك Wins / Kills — للألعاب الثانوية فقط
     منفصل تماماً عن منطق FC. لا يشترك معه في أي دالة،
     ولا تُجمع أرقامه مع أهداف FC في أي موضع.
     القاعدة: Wins هو المعيار الأساسي، وKills يكسر التعادل.
     ══════════════════════════════════════════════════ */

  /* فائز مباراة في لعبة Wins/Kills */
  wkWinner(m){
    if(m.status !== 'completed') return null;
    const wa = Number(m.wins_a||0), wb = Number(m.wins_b||0);
    if(wa > wb) return m.player_a;
    if(wb > wa) return m.player_b;
    const ka = Number(m.kills_a||0), kb = Number(m.kills_b||0);   // Kills يكسر التعادل
    if(ka > kb) return m.player_a;
    if(kb > ka) return m.player_b;
    return null;
  },

  /* ترتيب بطولة النقاط: مجموع النقاط ← Wins ← Kills
     النقاط = (Wins × وزن الفوز) + (Kills × وزن الإقصاء) */
  wkStandings(matches, entries, pts){
    const P = { ...CFG.WK_POINTS, ...(pts || {}) };
    const rows = {};
    entries.forEach(e => {
      rows[e.player_id] = { id:e.player_id, name:e.player.name,
        pld:0, wins:0, kills:0, mw:0, ml:0, md:0 };
    });
    matches.filter(m => m.status === 'completed').forEach(m => {
      const A = rows[m.player_a], B = rows[m.player_b];
      if(!A || !B) return;
      const wa = Number(m.wins_a||0),  wb = Number(m.wins_b||0);
      const ka = Number(m.kills_a||0), kb = Number(m.kills_b||0);
      A.pld++; B.pld++;
      A.wins += wa; B.wins += wb;
      A.kills += ka; B.kills += kb;
      const w = Engine.wkWinner(m);
      if(w === m.player_a){ A.mw++; B.ml++; }
      else if(w === m.player_b){ B.mw++; A.ml++; }
      else { A.md++; B.md++; }
    });
    const list = Object.values(rows);
    list.forEach(r => r.pts = r.wins * P.win + r.kills * P.kill);
    list.sort((a,b)=> b.pts - a.pts || b.wins - a.wins || b.kills - a.kills
      || a.name.localeCompare(b.name,'ar'));
    list.forEach((r,i)=> {
      r.rank = i + 1;
      r.kpw = r.wins ? r.kills / r.wins : 0;
      r.avgK = r.pld ? r.kills / r.pld : 0;
    });
    return list;
  },

  /* بطل بطولة Wins/Kills */
  wkTitleHolder(t, matches, entries){
    if(!matches.length) return null;
    if(t.kind === 'knockout'){
      const last = matches.reduce((x,m)=> Math.max(x, m.round), 0);
      const fin = matches.find(m => m.round === last);
      return fin ? this.wkWinner(fin) : null;
    }
    if(!this.isFinished(matches)) return null;
    const tb = this.wkStandings(matches, entries, t.points);
    return tb.length && tb[0].pld > 0 ? tb[0].id : null;
  },

  /* مسيرة لاعب داخل لعبة واحدة — لا تُخلط مع غيرها أبداً.
     النقاط تُحسب بوزن كل بطولة على حدة. */
  wkCareer(players, tournaments, entries, matches){
    const W = {};
    tournaments.forEach(t => W[t.id] = { ...CFG.WK_POINTS, ...(t.points || {}) });

    const rows = {};
    players.forEach(p => rows[p.id] = {
      id:p.id, name:p.name, trns:0, titles:0,
      pld:0, wins:0, kills:0, mw:0, ml:0, pts:0
    });
    entries.forEach(e => { if(rows[e.player_id]) rows[e.player_id].trns++; });

    matches.filter(m => m.status === 'completed').forEach(m => {
      const P = W[m.tournament_id] || CFG.WK_POINTS;
      const A = rows[m.player_a], B = rows[m.player_b];
      if(A){
        A.pld++; A.wins += Number(m.wins_a||0); A.kills += Number(m.kills_a||0);
        A.pts += Number(m.wins_a||0)*P.win + Number(m.kills_a||0)*P.kill;
      }
      if(B){
        B.pld++; B.wins += Number(m.wins_b||0); B.kills += Number(m.kills_b||0);
        B.pts += Number(m.wins_b||0)*P.win + Number(m.kills_b||0)*P.kill;
      }
      const w = this.wkWinner(m);
      if(w && rows[w]) rows[w].mw++;
      const l = w === m.player_a ? m.player_b : w === m.player_b ? m.player_a : null;
      if(l && rows[l]) rows[l].ml++;
    });

    tournaments.forEach(t => {
      const ms = matches.filter(m => m.tournament_id === t.id);
      const en = entries.filter(e => e.tournament_id === t.id)
        .map(e => ({ ...e, player: players.find(p => p.id === e.player_id) }))
        .filter(e => e.player);
      const w = this.wkTitleHolder(t, ms, en);
      if(w && rows[w]) rows[w].titles++;
    });

    return Object.values(rows).map(r => ({ ...r,
      kpw: r.wins ? r.kills / r.wins : 0,
      winPct: r.pld ? (r.mw / r.pld) * 100 : 0 }));
  },

  /* موجّهات واعية باللعبة — تختار المسار الصحيح بلا خلط */
  winnerFor(m, game){
    return (CFG.GAMES[game]?.scoring === 'wk') ? this.wkWinner(m) : this.winnerOf(m);
  },
  titleFor(t, matches, entries){
    return (CFG.GAMES[t.game || 'fc']?.scoring === 'wk')
      ? this.wkTitleHolder(t, matches, entries)
      : this.titleHolder(t, matches, entries);
  },

  summary(t, matches, entries){
    const played = matches.filter(m => m.status === 'completed').length;
    const fin = this.isFinished(matches);
    const state = !matches.length ? 'upcoming' : fin ? 'finished' : 'live';
    const round = matches.length ? this.currentRound(matches) : 0;
    const wk = CFG.GAMES[t.game || 'fc']?.scoring === 'wk';
    let leader = null, stage = '';
    if(t.kind === 'knockout'){
      stage = matches.length ? this.roundLabel(round, matches) : '';
    } else if(matches.length){
      const tb = wk ? this.wkStandings(matches, entries, t.points)
                    : this.standings(matches, entries, t.points);
      leader = tb.length && tb[0].pld > 0 ? tb[0] : null;
    }
    return { state, fin, round, stage, leader, wk,
             players: entries.length, played, total: matches.length,
             champion: this.titleFor(t, matches, entries) };
  },

  careerStats(players, tournaments, allEntries, allMatches){
    const rows = {};
    players.forEach(p => rows[p.id] = {
      id:p.id, name:p.name, game_id:p.game_id, platform:p.platform,
      trns:0, titles:0, pld:0, w:0, d:0, l:0, gf:0, ga:0
    });

    allEntries.forEach(e => { if(rows[e.player_id]) rows[e.player_id].trns++; });

    allMatches.filter(m => m.status === 'completed').forEach(m => {
      const dec = m.result_type === 'decision' || m.result_type === 'walkover';
      [[m.player_a, Number(m.score_a), Number(m.score_b)],
       [m.player_b, Number(m.score_b), Number(m.score_a)]].forEach(([id, mine, his]) => {
        const r = rows[id]; if(!r) return;
        r.pld++;
        if(!dec){ r.gf += mine; r.ga += his; }
        if(mine > his) r.w++; else if(mine < his) r.l++; else r.d++;
      });
    });

    tournaments.forEach(t => {
      const ms = allMatches.filter(m => m.tournament_id === t.id);
      const en = allEntries.filter(e => e.tournament_id === t.id)
        .map(e => ({ ...e, player: players.find(p => p.id === e.player_id) }))
        .filter(e => e.player);
      const w = this.titleHolder(t, ms, en);
      if(w && rows[w]) rows[w].titles++;
    });

    return Object.values(rows).map(r => ({ ...r, gd: r.gf - r.ga,
      winPct: r.pld ? (r.w / r.pld) * 100 : 0 }));
  },

  champion(matches){
    const last = matches.reduce((x,m)=> Math.max(x, m.round), 0);
    const fin = matches.find(m => m.round === last);
    return fin ? Engine.winnerOf(fin) : null;
  },

  playerStats(matches, entries){
    const rows = {};
    entries.forEach(e => rows[e.player_id] = {
      id:e.player_id, name:e.player.name,
      pld:0, w:0, d:0, l:0, gf:0, ga:0, clean:0, blank:0,
      best:0, bestTxt:'—', worst:0, worstTxt:'—', streak:0, _cur:0
    });

    const done = matches.filter(m => m.status === 'completed' && m.result_type !== 'decision')
      .slice().sort((a,b)=> (a.result_at||'').localeCompare(b.result_at||'') || a.round - b.round);

    done.forEach(m => {
      [[m.player_a, m.player_b, Number(m.score_a), Number(m.score_b)],
       [m.player_b, m.player_a, Number(m.score_b), Number(m.score_a)]].forEach(([me, opp, mine, his]) => {
        const r = rows[me]; if(!r) return;
        r.pld++; r.gf += mine; r.ga += his;
        if(his === 0) r.clean++;
        if(mine === 0) r.blank++;
        if(mine > his){
          r.w++; r._cur++; r.streak = Math.max(r.streak, r._cur);
          if(mine - his > r.best){ r.best = mine - his; r.bestTxt = `${mine} – ${his}`; }
        } else if(mine < his){
          r.l++; r._cur = 0;
          if(his - mine > r.worst){ r.worst = his - mine; r.worstTxt = `${mine} – ${his}`; }
        } else { r.d++; r._cur = 0; }
      });
    });

    return Object.values(rows).map(r => ({
      ...r,
      gd: r.gf - r.ga,
      avgFor: r.pld ? r.gf / r.pld : 0,
      avgAgainst: r.pld ? r.ga / r.pld : 0,
      winPct: r.pld ? (r.w / r.pld) * 100 : 0
    }));
  },

  currentRound(matches){
    const un = matches.filter(m => !['completed','cancelled'].includes(m.status));
    if(!un.length) return matches.reduce((x,m)=> Math.max(x,m.round), 1);
    return un.reduce((x,m)=> Math.min(x,m.round), 999);
  },

  leader(standings){ return standings[0] || null; }
};

/* ─────────── 6) الواجهة ─────────── */
const UI = {
  state: { route:'/', param:null, roundView:null },

  /* — أدوات عرض — */
  toast(msg, kind){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast on ' + (kind || '');
    clearTimeout(this._tt);
    this._tt = setTimeout(()=> t.className = 'toast', 2600);
  },
  sheet(title, html){
    document.getElementById('sheet').innerHTML =
      `<div class="sheet-head"><h3>${title}</h3><button class="x" onclick="UI.closeSheet()">✕</button></div>${html}`;
    document.getElementById('sheetbg').classList.add('on');
  },
  closeSheet(){ document.getElementById('sheetbg').classList.remove('on'); },

  av(name, isMe){
    return `<div class="av ${isMe?'me':''}">${U.esc(U.initials(name))}</div>`;
  },

  trophyImg(n, cls){
    const i = Math.min(TROPHIES.length, Math.max(1, Number(n) || 1)) - 1;
    return `<img src="${TROPHIES[i]}" alt="" class="${cls||''}" loading="lazy"
      style="max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))">`;
  },

  /* — لوحة النتيجة — */
  board(m, players){
    const A = players[m.player_a], B = players[m.player_b];
    const me = Store.me;
    const st = CFG.STATUS[m.status] || CFG.STATUS.scheduled;
    const done = m.status === 'completed';
    const wk = Store.scoringOf(m.tournament_id) === 'wk';
    const tbd = !m.player_a || !m.player_b;

    /* الفائز يُحدَّد بمنطق اللعبة نفسها — لا خلط بين المسارين */
    const win = done ? Engine.winnerFor(m, Store.gameOf(m.tournament_id)) : null;
    const dimA = done && win && win !== m.player_a;
    const dimB = done && win && win !== m.player_b;

    const nmA = `<div class="nm ${dimA ? 'dimmed':''}">${A ? U.esc(A.name) : '<span class="dim">بانتظار الفائز</span>'}</div>`;
    const nmB = `<div class="nm ${dimB ? 'dimmed':''}">${B ? U.esc(B.name) : '<span class="dim">بانتظار الفائز</span>'}</div>`;

    let scoreBox;
    if(wk){
      scoreBox = (m.wins_a == null)
        ? `<div class="score pending">${m.status==='postponed' ? 'مؤجلة'
            : m.status==='cancelled' ? 'ملغاة'
            : tbd ? '—' : U.fmtTime(m.match_time)}</div>`
        : `<div><div class="score">${m.wins_a} <span class="dim">–</span> ${m.wins_b}</div>
             <div class="tiny dim" style="text-align:center">💀 ${m.kills_a||0} – ${m.kills_b||0}</div></div>`;
    } else {
      const sa = Number(m.score_a), sb = Number(m.score_b);
      const pens = (m.pen_a != null && m.pen_b != null)
        ? `<div class="tiny dim" style="text-align:center">${m.pen_a} <span class="dim">–</span> ${m.pen_b} ركلات</div>` : '';
      scoreBox = (m.score_a==null)
        ? `<div class="score pending">${m.status==='postponed' ? 'مؤجلة'
            : m.status==='cancelled' ? 'ملغاة'
            : tbd ? '—' : U.fmtTime(m.match_time)}</div>`
        : `<div><div class="score">${sa} <span class="dim">–</span> ${sb}</div>${pens}</div>`;
    }

    let badge = `<span class="tag ${st.cls}">${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</span>`;
    if(done && m.result_type==='walkover') badge = `<span class="tag">فوز بالانسحاب</span>`;
    if(done && m.result_type==='decision') badge = `<span class="tag">قرار إداري</span>`;

    return `<button class="board" data-s="${m.status}" onclick="location.hash='#/match/${m.id}'">
      <div class="board-top">
        <span class="eyebrow">${this._roundNames?.[m.round] || 'الجولة ' + m.round}</span>
        <span class="dim tiny">·</span>
        <span class="tiny dim">${U.fmtDate(m.match_date)}</span>
        <div class="spacer"></div>
        ${badge}
      </div>
      <div class="board-grid">
        <div class="side">${A ? this.av(A.name, A.id===me) : '<div class="av dim">?</div>'}${nmA}</div>
        ${scoreBox}
        <div class="side b">${B ? this.av(B.name, B.id===me) : '<div class="av dim">?</div>'}${nmB}</div>
      </div>
    </button>`;
  },

  cacheRoundNames(t, ms){
    this._roundNames = null;
    if(t?.kind !== 'knockout' || !ms?.length) return;
    const last = ms.reduce((x,m)=> Math.max(x, m.round), 1);
    this._roundNames = {};
    for(let r = 1; r <= last; r++) this._roundNames[r] = Engine.roundName(Math.pow(2, last - r));
  },

  async playersMap(){
    const all = await Store.players();
    const map = {}; all.forEach(p => map[p.id] = p); return map;
  },

  /* — بطولات مفتوحة للانضمام — */
  async joinSection(){
    if(!Store.myPlayer) return '';
    const open = await Store.openTournaments();
    if(!open.length) return '';
    const reqs = await Store.myRequests();
    const rows = [];
    for(const t of open){
      const ents = await Store.entries(t.id);
      if(ents.some(e => e.player_id === Store.me)) continue;
      const r = reqs.find(x => x.tournament_id === t.id);
      rows.push({ t, pending: r && r.status === 'pending' });
    }
    if(!rows.length) return '';

    return `<div class="sec"><h2>بطولات مفتوحة</h2><div class="rule"></div></div>
    ${rows.map(({t,pending})=>`
      <div class="card" style="display:flex;align-items:center;gap:11px">
        <div class="tcard-cup" style="width:34px;height:40px;display:grid;place-items:center;flex-shrink:0">
          ${this.trophyImg(t.trophy)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:.8rem">${U.esc(t.name)}</div>
          <div class="tiny dim">${CFG.kindLabel(t.game||'fc', t.kind)} ·
            ${t.join_mode==='open'?'انضمام فوري':'بموافقة المشرف'} · ${U.fmtDate(t.start_date)}</div>
        </div>
        ${pending ? `<span class="tag violet">قيد المراجعة</span>`
          : `<button class="btn sm solid" onclick="UI.join('${t.id}')">انضم</button>`}
      </div>`).join('')}`;
  },
  async join(tid){
    try{
      const r = await Store.requestJoin(tid);
      this.render();
      this.toast(r === 'joined' ? 'انضممت للبطولة' : 'أُرسل طلبك للمشرف','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  /* — الشريط العلوي — */
  async chrome(){
    const t = await Store.activeTournament();
    document.querySelector('#tchip span').textContent = t ? t.name : 'لا توجد بطولة';
    document.querySelector('#mechip span').textContent =
      Store.myPlayer ? Store.myPlayer.name : (Store.session ? 'اربط حسابك' : 'دخول');
    document.querySelectorAll('.nav a').forEach(a =>
      a.classList.toggle('on', a.dataset.r === '/' + (this.state.route.split('/')[1] || '')));
    const na = document.getElementById('navadmin');
    if(na) na.style.display = Store.isAdmin ? 'flex' : 'none';
    const lg = document.getElementById('brandlogo');
    if(lg) lg.innerHTML = 'بطولات <b>' + U.esc(CFG.BRAND.game) + '</b>';
  },

  _taps: 0,
  secret(){
    this._taps++;
    clearTimeout(this._tapT);
    this._tapT = setTimeout(()=> this._taps = 0, 1400);
    if(this._taps >= 3){
      this._taps = 0;
      this.toast('لوحة الإدارة');
      location.hash = '#/admin';
    }
  },
  foot(){
    return `<div class="foot" onclick="UI.secret()">${U.esc(CFG.BRAND.game)}</div>`;
  },

  /* — نافذة اختيار البطولة — */
  async tournamentSheet(){
    const list = await Store.tournaments();
    const act = Store.db.meta.activeTournament;
    const rows = list.length ? list.map(t => `
      <button class="pick ${t.id===act?'on':''}" onclick="UI.pickTournament('${t.id}')">
        <div style="width:26px;height:32px;display:grid;place-items:center;flex-shrink:0">
          ${this.trophyImg(t.trophy)}</div>
        <div class="nm">${U.esc(t.name)}<div class="tiny dim" style="font-weight:700">${CFG.kindLabel(t.game||'fc', t.kind)}${t.kind!=='knockout'?' · '+(t.format==='double'?'ذهاب وإياب':'ذهاب فقط'):''} · ${t.status==='active'?'جارية':'مسودة'}</div></div>
      </button>`).join('')
      : `<div class="empty"><h3>لا توجد بطولات</h3><p>أنشئ أول بطولة من صفحة الإدارة.</p></div>`;
    this.sheet('البطولات', rows +
      (Store.isAdmin ? `<button class="btn solid full" style="margin-top:10px" onclick="UI.closeSheet();location.hash='#/admin'">إدارة البطولات</button>` : ''));
  },
  async pickTournament(id){
    await Store.setActiveTournament(id);
    this.closeSheet(); this.render(); this.toast('تم التبديل','ok');
  },

  /* — الحساب — */
  async identitySheet(){
    if(!Store.configured) return this.sheet('غير مربوط',
      `<div class="note warn">لم تُضبط بيانات Supabase بعد. افتح الملف وعبّئ <b>CFG.SB</b> في أعلى الكود.</div>`);
    if(!Store.session) return this.authSheet('login');
    if(!Store.myPlayer) return this.linkSheet();
    this.closeSheet();
    location.hash = '#/account';
  },

  authSheet(mode){
    const isLogin = mode === 'login';
    this.sheet(isLogin ? 'تسجيل الدخول' : 'حساب جديد', `
      <div class="seg" style="margin-bottom:14px">
        <button class="${isLogin?'on':''}" onclick="UI.authSheet('login')">دخول</button>
        <button class="${!isLogin?'on':''}" onclick="UI.authSheet('signup')">حساب جديد</button>
      </div>
      ${!isLogin ? `<div class="field"><label>اسمك كما يظهر للجميع</label>
        <input class="input" id="au_name" placeholder="فهد" autocomplete="name"></div>` : ''}
      <div class="field"><label>اسم المستخدم</label>
        <input class="input" id="au_user" dir="ltr" style="text-align:left"
          placeholder="fahad" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label>
        <input class="input" id="au_pass" type="password" dir="ltr" style="text-align:left"
          placeholder="••••••" autocomplete="${isLogin?'current-password':'new-password'}"
          onkeydown="if(event.key==='Enter')UI.doAuth('${mode}')"></div>
      <button class="btn solid full" id="au_btn" onclick="UI.doAuth('${mode}')">
        ${isLogin ? 'دخول' : 'إنشاء الحساب'}</button>
      <div class="tiny dim center" style="margin-top:9px">
        ${isLogin ? 'ليس لديك حساب؟ اختر «حساب جديد» بالأعلى.'
                  : 'حروف إنجليزية وأرقام فقط في اسم المستخدم.'}</div>`);
  },

  async doAuth(mode){
    const btn = document.getElementById('au_btn');
    const u = document.getElementById('au_user').value;
    const p = document.getElementById('au_pass').value;
    const n = document.getElementById('au_name')?.value;
    btn.disabled = true; btn.textContent = 'جارٍ…';
    try{
      if(mode === 'login') await Store.signIn(u, p);
      else await Store.signUp(u, p, n);
      this.closeSheet();
      this.toast('أهلاً بك','ok');
      await this.render();
      if(!Store.myPlayer) setTimeout(()=>this.linkSheet(), 400);
    }catch(e){
      this.toast(e.message,'err');
      btn.disabled = false; btn.textContent = mode==='login' ? 'دخول' : 'إنشاء الحساب';
    }
  },

  async linkSheet(){
    const free = (await Store.players()).filter(p => !p.profile_id);
    this.sheet('اربط حسابك بلاعب', `
      <div class="note">اختر اسمك من اللاعبين الذين أضافتهم الإدارة، أو أنشئ لاعباً جديداً باسمك.</div>
      ${free.length ? free.map(p=>`<button class="pick" onclick="UI.claim('${p.id}')">
        ${this.av(p.name)}<div class="nm">${U.esc(p.name)}</div></button>`).join('')
        : '<div class="tiny dim center" style="margin:12px 0">لا يوجد لاعبون متاحون للربط.</div>'}
      <div class="sec"><h2>أو أنشئ لاعباً جديداً</h2><div class="rule"></div></div>
      <div class="row">
        <input class="input" id="np_name" placeholder="اسمك" style="flex:1"
          value="${U.esc(Store.profile?.display_name||'')}">
        <button class="btn solid" onclick="UI.createMine()">إنشاء</button>
      </div>
      <button class="btn full" style="margin-top:11px" onclick="UI.closeSheet()">لاحقاً</button>`);
  },
  async claim(id){
    try{ await Store.claimPlayer(id); this.closeSheet(); this.render(); this.toast('ارتبط حسابك','ok'); }
    catch(e){ this.toast(e.message,'err'); }
  },
  async createMine(){
    const n = document.getElementById('np_name').value.trim();
    if(!n) return this.toast('اكتب اسمك','err');
    try{ await Store.createMyPlayer(n); this.closeSheet(); this.render(); this.toast('تم إنشاء اللاعب','ok'); }
    catch(e){ this.toast(e.message,'err'); }
  },
  async signOut(){
    await Store.signOut(); this.closeSheet(); this.render(); this.toast('خرجت من حسابك');
  },

  /* ═══════════ صفحة البطولات ═══════════ */
  async tSummary(t){
    const ms = await Store.matches(t.id);
    const en = await Store.entries(t.id);
    return Engine.summary(t, ms, en);
  },
  stateTag(sm){
    return sm.state === 'live' ? '<span class="tag win"><i class="dot"></i>جارية</span>'
         : sm.state === 'finished' ? '<span class="tag">مكتملة</span>'
         : '<span class="tag violet">قادمة</span>';
  },
  tCard(t, sm, PM){
    const isCup = t.kind === 'knockout';
    const facts = isCup
      ? `<span>المرحلة <b>${sm.stage || '—'}</b></span><span>المشاركون <b>${sm.players}</b></span>`
      : `<span>الجولة <b>${sm.round || '—'}</b></span><span>المشاركون <b>${sm.players}</b></span>
         <span>المباريات <b>${sm.played}/${sm.total}</b></span>`;
    const crown = sm.champion
      ? `<span class="tag gold">🏆 ${U.esc(PM[sm.champion]?.name || '')}</span>`
      : (!isCup && sm.leader ? `<span class="tag">المتصدر ${U.esc(sm.leader.name)}</span>` : '');

    return `<button class="tcard ${sm.state==='finished'?'done':''}" onclick="location.hash='#/t/${t.id}'">
      <div class="cup">${this.trophyImg(t.trophy)}</div>
      <div class="body">
        <div class="ttl">${U.esc(t.name)}</div>
        <div class="meta">
          <span class="tag">${CFG.kindLabel(t.game||'fc', t.kind)}</span>
          ${this.stateTag(sm)}${crown}
        </div>
        <div class="facts">${facts}</div>
      </div>
      <div class="go">‹</div>
    </button>`;
  },

  async viewTournaments(){
    const every = await Store.tournaments();
    const all = every.filter(t => (t.game||'fc') === 'fc');   // القسم الرئيسي: FC فقط
    const PM = await this.playersMap();
    const sms = {};
    for(const t of all) sms[t.id] = await this.tSummary(t);

    const live = all.filter(t => sms[t.id].state === 'live');
    const soon = all.filter(t => sms[t.id].state === 'upcoming');
    const done = all.filter(t => sms[t.id].state === 'finished');

    let h = `<div class="phead">
      <h1>بطولات ${U.esc(CFG.BRAND.game)}</h1>
      <div class="sub">${all.length} بطولة</div>
      ${Store.isAdmin ? `<button class="btn sm solid act" onclick="UI.tournamentForm()">بطولة جديدة</button>` : ''}
    </div>`;

    if(!all.length){
      h += Store.isAdmin
        ? `<div class="empty" style="margin-top:20px"><h3>لا توجد بطولات ${U.esc(CFG.BRAND.game)}</h3>
             <p>أنشئ أول بطولة لتبدأ.</p>
             <button class="btn solid" onclick="UI.tournamentForm()">بطولة جديدة</button></div>`
        : this.waiting('لم تنطلق البطولات بعد',
            'ما إن يعلن المشرفون عن البطولة حتى تظهر هنا.', 'tournament');
      return h + await this.gamesSection(every);
    }

    h += `<div class="kpis" style="margin-bottom:6px">
      <div class="kpi"><b class="num">${live.length}</b><span>جارية</span></div>
      <div class="kpi"><b class="num">${soon.length}</b><span>قادمة</span></div>
      <div class="kpi"><b class="num">${done.length}</b><span>مكتملة</span></div>
      <div class="kpi"><b class="num">${Store.gameMatches('fc').length}</b><span>مباراة</span></div>
    </div>`;

    h += await this.joinSection();

    const league = all.filter(t => t.kind !== 'knockout');
    const cup    = all.filter(t => t.kind === 'knockout');
    const ord = x => ({live:0, upcoming:1, finished:2})[sms[x.id].state];

    if(league.length){
      h += `<div class="sec"><h2>بطولات الدوري</h2><div class="rule"></div>
        <span class="tag">${league.length}</span></div>`;
      h += league.slice().sort((a,b)=>ord(a)-ord(b))
        .map(t => this.tCard(t, sms[t.id], PM)).join('');
    }
    if(cup.length){
      h += `<div class="sec"><h2>بطولات الأدوار الإقصائية</h2><div class="rule"></div>
        <span class="tag">${cup.length}</span></div>`;
      h += cup.slice().sort((a,b)=>ord(a)-ord(b))
        .map(t => this.tCard(t, sms[t.id], PM)).join('');
    }

    const today = U.today();
    const soonest = Store.gameMatches('fc')
      .filter(m => !['completed','cancelled'].includes(m.status) && m.player_a && m.player_b)
      .sort((a,b)=> (a.match_date+a.match_time).localeCompare(b.match_date+b.match_time))
      .slice(0, 3);
    if(soonest.length){
      const TN = {}; all.forEach(t => TN[t.id] = t.name);
      h += `<div class="sec"><h2>أقرب المباريات</h2><div class="rule"></div>
        <a class="more" href="#/matches">مركز المباريات</a></div>
      <div class="card" style="padding:4px 12px">
        ${soonest.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;
          border-bottom:1px solid var(--line)">
          <div style="flex:1;min-width:0">
            <div class="tiny" style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ${U.esc(PM[m.player_a]?.name||'')} <span class="dim">×</span> ${U.esc(PM[m.player_b]?.name||'')}</div>
            <div class="tiny dim" style="font-size:.58rem">${U.esc(TN[m.tournament_id]||'')}</div>
          </div>
          <span class="tag">${m.match_date===today ? U.fmtTime(m.match_time) : U.fmtDate(m.match_date)}</span>
        </div>`).join('')}
      </div>`;
    }
    return h + await this.gamesSection(every);
  },

  /* ── قسم الألعاب الأخرى — ثانوي، أسفل القسم الرئيسي ── */
  async gamesSection(all){
    const cards = CFG.SECONDARY.map(g => {
      const G = CFG.GAMES[g];
      const ts = all.filter(t => t.game === g);
      const live = ts.filter(t => {
        const ms = Store.cache.matches[t.id] || [];
        return ms.length && !Engine.isFinished(ms);
      }).length;
      return `<button class="gcard" onclick="location.hash='#/g/${g}'">
        <div class="gico">${CFG.gameIcon(g)}</div>
        <div class="gbody">
          <div class="gname">${U.esc(G.name)}</div>
          ${G.sub ? `<div class="gsub">${U.esc(G.sub)}</div>` : ''}
          <div class="tiny dim" style="margin-top:3px">
            ${ts.length ? `${ts.length} بطولة${live ? ` · ${live} جارية` : ''}` : 'لا بطولات بعد'}</div>
        </div>
        <div class="go">‹</div>
      </button>`;
    }).join('');

    return `<div class="sec" style="margin-top:26px">
      <h2>🎮 الألعاب الأخرى</h2><div class="rule"></div></div>
      <div class="tiny dim" style="margin-bottom:9px">
        إحصائياتها وترتيبها مستقلة تماماً عن ${U.esc(CFG.BRAND.game)}.</div>
      ${cards}`;
  },

  /* ═══════════ صفحة بطولة واحدة ═══════════ */
  /* ═══════════ صفحة لعبة ثانوية ═══════════
     ترتيب وإحصائيات مستقلة تماماً — لا ترتيب عام يجمع الألعاب. */
  async viewGame(g){
    const G = CFG.GAMES[g];
    if(!G || G.primary) return `<div class="empty" style="margin-top:40px">
      <h3>اللعبة غير موجودة</h3><a class="btn" href="#/">الرئيسية</a></div>`;

    const all = (await Store.tournaments()).filter(t => t.game === g);
    const players = await Store.players();
    const PM = await this.playersMap();
    const ents = Store.gameEntries(g);
    const mts  = Store.gameMatches(g);
    const cur  = this.state.sub || 'tournaments';

    let h = `<div class="phead" style="align-items:center">
      <div class="gico" style="width:40px;height:40px">${CFG.gameIcon(g)}</div>
      <div style="flex:1;min-width:0">
        <div class="tiny dim" style="font-weight:800">
          <a href="#/" style="color:var(--ink-3);text-decoration:none">الألعاب الأخرى</a></div>
        <h1 style="font-size:1.02rem">${U.esc(G.name)}</h1>
        ${G.sub ? `<div class="tiny dim" style="font-weight:700">${U.esc(G.sub)}</div>` : ''}
      </div>
      ${Store.isAdmin ? `<button class="btn sm solid" onclick="UI.presetSheet('${g}')">بطولة</button>` : ''}
    </div>
    <div class="filters">
      ${[['tournaments','البطولات'],['ranking','الترتيب'],['matches','المباريات']]
        .map(([k,l])=>`<button class="fbtn ${k===cur?'on':''}"
          onclick="location.hash='#/g/${g}/${k}'">${l}</button>`).join('')}
    </div>`;

    if(!all.length){
      return h + (Store.isAdmin
        ? `<div class="empty" style="margin-top:20px"><h3>لا بطولات ${U.esc(G.name)} بعد</h3>
             <p>اختر نوع البطولة لتبدأ.</p></div>
           ${this.gamePresets(g)}`
        : `<div class="empty" style="margin-top:24px"><h3>لا بطولات بعد</h3>
             <p>ستظهر هنا فور إعلانها.</p></div>`);
    }

    /* ── الترتيب: Wins أساسي، Kills يكسر التعادل ── */
    if(cur === 'ranking'){
      const rows = Engine.wkCareer(players, all, ents, mts).filter(r => r.trns > 0);
      if(!rows.some(r => r.pld))
        return h + `<div class="empty" style="margin-top:24px"><h3>لا نتائج بعد</h3>
          <p>يظهر الترتيب فور اعتماد أول نتيجة.</p></div>`;
      rows.sort((a,b)=> b.pts - a.pts || b.wins - a.wins || b.kills - a.kills
        || a.name.localeCompare(b.name,'ar'));
      const tot = rows.reduce((x,r)=>({w:x.w+r.wins, k:x.k+r.kills}), {w:0,k:0});

      h += `<div class="kpis" style="margin-bottom:12px">
        <div class="kpi"><b class="num">${rows.filter(r=>r.pld).length}</b><span>لاعب</span></div>
        <div class="kpi"><b class="num">${all.length}</b><span>بطولة</span></div>
        <div class="kpi"><b class="num" style="color:var(--gold)">${tot.w}</b><span>Wins</span></div>
        <div class="kpi"><b class="num" style="color:var(--lose)">${tot.k}</b><span>Kills</span></div>
      </div>
      <div class="card" style="padding:8px 10px">
        <table class="table"><thead><tr>
          <th>#</th><th>اللاعب</th><th>لعب</th><th>🏆 Wins</th><th>💀 Kills</th><th>النقاط</th><th>ألقاب</th>
        </tr></thead><tbody>
        ${rows.map((r,i)=>`<tr class="${r.id===Store.me?'me':''}"
          onclick="location.hash='#/player/${r.id}'" style="cursor:pointer">
          <td class="rank ${i<3?'top':''} num">${i+1}</td>
          <td style="text-align:right"><div class="pl">${this.av(r.name, r.id===Store.me)}
            <div class="nm">${U.esc(r.name)}</div></div></td>
          <td class="num">${r.pld}</td>
          <td class="num">${r.wins}</td>
          <td class="num" style="color:var(--lose)">${r.kills}</td>
          <td class="pts num">${r.pts}</td>
          <td class="num" style="color:${r.titles?'var(--gold)':'inherit'}">${r.titles || '—'}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      <div class="note" style="margin-top:12px">
        الترتيب حسب مجموع النقاط عبر كل بطولات ${U.esc(G.name)}، ثم <b>Wins</b> ثم <b>Kills</b>.
        هذه الأرقام تخصّ ${U.esc(G.name)} وحدها ولا تُجمع مع أي لعبة أخرى.</div>`;
      return h;
    }

    /* ── مباريات اللعبة ── */
    if(cur === 'matches'){
      const list = mts.slice().sort((a,b)=>
        (b.match_date+b.match_time).localeCompare(a.match_date+a.match_time));
      if(!list.length) return h + `<div class="empty"><h3>لا مباريات بعد</h3></div>`;
      const TN = {}; all.forEach(t => TN[t.id] = t.name);
      return h + list.map(m => this.board(m, PM)).join('');
    }

    /* ── بطولات اللعبة ── */
    const sms = {};
    for(const t of all) sms[t.id] = await this.tSummary(t);
    const ord = x => ({live:0, upcoming:1, finished:2})[sms[x.id].state];
    h += all.slice().sort((a,b)=>ord(a)-ord(b))
      .map(t => this.tCard(t, sms[t.id], PM)).join('');
    return h;
  },

  /* بطاقتا نوعَي البطولة لكل لعبة — إنشاء بضغطة */
  gamePresets(g){
    const G = CFG.GAMES[g];
    const items = [
      { k:'knockout', d:'اللاعبان يتواجهان، الفائز ينتقل للمرحلة التالية والخاسر يخرج، حتى يتحدّد الفائز النهائي.' },
      { k:'league',   d:'عدة مباريات تُجمع فيها نقاط كل لاعب، ويظهر الترتيب في Leaderboard، وصاحب أعلى مجموع هو الفائز.' }
    ];
    return `<div class="sec"><h2>أنواع بطولات ${U.esc(G.name)}</h2><div class="rule"></div></div>
    ${items.map(it=>`
      <button class="tcard" onclick="UI.tournamentForm(null,'${g}','${it.k}')">
        <div class="gico" style="width:38px;height:38px">${CFG.gameIcon(g)}</div>
        <div class="body">
          <div class="ttl">${CFG.kindLabel(g, it.k)}</div>
          <div class="tiny" style="color:var(--gold);font-weight:800;margin-bottom:4px">
            ${CFG.kindEn(g, it.k)}</div>
          <div class="tiny dim" style="line-height:1.65">${it.d}</div>
        </div>
        <div class="go">‹</div>
      </button>`).join('')}`;
  },

  presetSheet(g){
    this.sheet('بطولة ' + U.esc(CFG.GAMES[g].name),
      `<div class="note">اختر نوع البطولة.</div>` + this.gamePresets(g));
  },

  async viewTournament(id){
    const t = await Store.tournament(id);
    if(!t) return `<div class="empty" style="margin-top:40px"><h3>البطولة غير موجودة</h3>
      <a class="btn" href="#/">كل البطولات</a></div>`;
    if(Store.db.meta.activeTournament !== id) await Store.setActiveTournament(id);

    const ms = await Store.matches(id);
    const ents = await Store.entries(id);
    const PM = await this.playersMap();
    const sm = Engine.summary(t, ms, ents);
    const isCup = t.kind === 'knockout';
    const g = t.game || 'fc';
    const wk = CFG.GAMES[g]?.scoring === 'wk';
    this.cacheRoundNames(t, ms);

    const tabs = isCup
      ? [['overview','نظرة عامة'],['knockout', wk?'المواجهات':'الأدوار الإقصائية'],['matches','المباريات'],['stats','الإحصائيات']]
      : [['overview','نظرة عامة'],['standings','الترتيب'],['matches','المباريات'],['stats','الإحصائيات']];
    const cur = this.state.sub || 'overview';

    let h = `<div class="phead" style="align-items:center">
      <div style="width:36px;height:44px;display:grid;place-items:center;flex-shrink:0">
        ${this.trophyImg(t.trophy)}</div>
      <div style="flex:1;min-width:0">
        <div class="tiny dim" style="font-weight:800">
          ${wk ? `<a href="#/g/${g}" style="color:var(--ink-3);text-decoration:none">${U.esc(CFG.GAMES[g].name)}</a>`
                : `<a href="#/" style="color:var(--ink-3);text-decoration:none">البطولات</a>`} ›
          ${CFG.kindLabel(g, t.kind)}</div>
        <h1 style="font-size:1.02rem">${U.esc(t.name)}</h1>
      </div>
      ${this.stateTag(sm)}
    </div>
    <div class="filters">
      ${tabs.map(([k,l])=>`<button class="fbtn ${k===cur?'on':''}"
        onclick="location.hash='#/t/${id}/${k}'">${l}</button>`).join('')}
    </div>`;

    if(!ms.length && cur !== 'overview')
      return h + (Store.isAdmin
        ? `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <a class="btn solid" href="#/admin">اذهب للإدارة</a></div>`
        : `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>يجهّز المشرفون المشاركين والمواعيد.</p></div>`);

    if(cur === 'standings')  return h + (wk ? this.wkTableHtml(t, ms, ents) : this.standingsHtml(t, ms, ents, PM));
    if(cur === 'knockout')   return h + this.knockoutHtml(t, ms, PM);
    if(cur === 'matches')    return h + this.tMatchesHtml(t, ms, PM);
    if(cur === 'stats')      return h + (wk ? this.wkStatsHtml(t, ms, ents) : this.statsHtml(t, ms, ents, PM));
    return h + await this.overviewHtml(t, ms, ents, PM, sm);
  },

  /* جدول ترتيب Wins/Kills داخل بطولة واحدة */
  wkTableHtml(t, ms, ents){
    const P = { ...CFG.WK_POINTS, ...(t.points || {}) };
    const rows = Engine.wkStandings(ms, ents, P);
    const me = Store.me;
    return `<div class="card" style="padding:8px 10px">
      <table class="table"><thead><tr>
        <th>#</th><th>اللاعب</th><th>لعب</th><th>🏆 Wins</th><th>💀 Kills</th><th>K/W</th><th>النقاط</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.id===me?'me':''}">
        <td class="rank ${r.rank<=3?'top':''} num">${r.rank}</td>
        <td><div class="pl">${this.av(r.name, r.id===me)}
          <div class="nm"><a href="#/player/${r.id}" style="color:inherit;text-decoration:none">${U.esc(r.name)}</a></div></div></td>
        <td class="num">${r.pld}</td>
        <td class="num">${r.wins}</td>
        <td class="num" style="color:var(--lose)">${r.kills}</td>
        <td class="num dim">${r.kpw ? r.kpw.toFixed(1) : '—'}</td>
        <td class="pts num">${r.pts}</td>
      </tr>`).join('')}
      </tbody></table></div>
    <div class="note" style="margin-top:12px">
      النقاط = (Wins × <b>${P.win}</b>) + (Kills × <b>${P.kill}</b>).
      عند تساوي النقاط يُرجَّح صاحب <b>Wins</b> الأعلى، ثم <b>Kills</b>.</div>`;
  },

  /* إحصائيات بطولة Wins/Kills */
  wkStatsHtml(t, ms, ents){
    const rows = Engine.wkStandings(ms, ents, t.points).filter(r => r.pld > 0);
    if(!rows.length) return `<div class="empty" style="margin-top:30px"><h3>لا إحصائيات بعد</h3>
      <p>تظهر هنا فور اعتماد أول نتيجة.</p></div>`;
    const tw = rows.reduce((x,r)=>x+r.wins,0), tk = rows.reduce((x,r)=>x+r.kills,0);
    const played = ms.filter(m=>m.status==='completed').length;

    let h = `<div class="card" style="margin-bottom:4px"><div class="kpis">
      <div class="kpi"><b class="num">${played}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num" style="color:var(--gold)">${tw}</b><span>Wins</span></div>
      <div class="kpi"><b class="num" style="color:var(--lose)">${tk}</b><span>Kills</span></div>
      <div class="kpi"><b class="num">${tw?(tk/tw).toFixed(1):'0'}</b><span>K/W</span></div>
    </div></div>`;

    const by = f => rows.slice().sort((a,b)=> b[f]-a[f]);
    if(t.kind !== 'knockout')
      h += this.chart('النقاط', by('pts').map(r=>({name:r.name, v:r.pts})), {note:'مجموع النقاط'});
    h += this.chart('🏆 Wins', by('wins').map(r=>({name:r.name, v:r.wins})), {note:'المعيار الأساسي'});
    h += this.chart('💀 Kills', by('kills').map(r=>({name:r.name, v:r.kills})), {tone:'red', note:'كاسر التعادل'});
    h += this.chart('Kills لكل فوز', by('kpw').map(r=>({name:r.name, v:r.kpw, t:r.kpw.toFixed(1)})), {tone:'dim'});
    h += this.chart('المباريات المكسوبة', by('mw').map(r=>({name:r.name, v:r.mw})));
    h += `<div class="note" style="margin-top:12px">
      هذه أرقام ${U.esc(CFG.GAMES[t.game]?.name||'')} وحدها — لا تدخل في إحصائيات ${U.esc(CFG.BRAND.game)} ولا أي لعبة أخرى.</div>`;
    return h;
  },

  async overviewHtml(t, ms, ents, PM, sm){
    const isCup = t.kind === 'knockout';
    const me = Store.me;
    const wk = sm.wk;
    const done = ms.filter(m=>m.status==='completed');
    const tally = wk
      ? done.reduce((x,m)=> x + Number(m.kills_a||0) + Number(m.kills_b||0), 0)
      : done.reduce((x,m)=> x + Number(m.score_a||0) + Number(m.score_b||0), 0);

    let h = `<div class="card"><div class="kpis">
      <div class="kpi"><b class="num">${sm.players}</b><span>لاعب</span></div>
      <div class="kpi"><b class="num">${isCup ? (sm.stage||'—') : sm.round}</b>
        <span>${isCup?'المرحلة':'الجولة'}</span></div>
      <div class="kpi"><b class="num">${sm.played}/${sm.total}</b><span>لعبت</span></div>
      <div class="kpi"><b class="num">${tally}</b><span>${wk?'Kills':'هدف'}</span></div>
    </div></div>`;

    if(sm.champion){
      h += `<div class="card" style="text-align:center;padding:18px 14px;
        background:linear-gradient(150deg,var(--gold-soft),var(--bg-2));border-color:var(--gold-line)">
        <div style="height:96px;display:grid;place-items:center">${this.trophyImg(t.trophy)}</div>
        <div class="eyebrow" style="margin-top:6px">البطل</div>
        <div style="font-size:1.15rem;font-weight:900;color:var(--gold)">
          ${U.esc(PM[sm.champion]?.name||'')}</div>
      </div>`;
    }

    if(!ms.length){
      h += Store.isAdmin
        ? `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>حدّد المشاركين ثم ابنِ الجدول.</p>
             <a class="btn solid" href="#/admin">اذهب للإدارة</a></div>`
        : `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>يجهّز المشرفون المشاركين والمواعيد.</p></div>`;
      return h;
    }

    if(!isCup && sm.leader){
      h += `<div class="sec"><h2>المتصدر</h2><div class="rule"></div>
        <a class="more" href="#/t/${t.id}/standings">الجدول</a></div>
      <div class="card" style="display:flex;align-items:center;gap:12px">
        ${this.av(sm.leader.name, sm.leader.id===me)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:.84rem">${U.esc(sm.leader.name)}</div>
          <div class="tiny dim">${wk
            ? `${sm.leader.pld} مباراة · 💀 ${sm.leader.kills} Kills`
            : `${sm.leader.pld} مباراة · ${sm.leader.w} فوز`}</div>
        </div>
        <div style="text-align:center">
          <div class="pts num" style="font-size:1.25rem">${wk ? sm.leader.wins : sm.leader.pts}</div>
          <div class="tiny dim">${wk ? 'Wins' : 'نقطة'}</div></div>
      </div>`;
    }

    if(isCup && !sm.champion){
      const cur = ms.filter(m => m.round === sm.round);
      if(cur.length){
        h += `<div class="sec"><h2>${sm.stage}</h2><div class="rule"></div>
          <a class="more" href="#/t/${t.id}/knockout">المسار</a></div>
          ${cur.map(m=>this.board(m,PM)).join('')}`;
      }
    }

    const mine = me ? ms.filter(m => (m.player_a===me||m.player_b===me)
      && !['completed','cancelled'].includes(m.status))
      .sort((a,b)=> a.match_date.localeCompare(b.match_date))[0] : null;
    if(mine){
      h += `<div class="sec"><h2>مباراتي القادمة</h2><div class="rule"></div></div>${this.board(mine, PM)}`;
    }

    const needMe = me ? ms.filter(m => m.status==='pending_confirmation'
      && m.reported_by && m.reported_by !== me && (m.player_a===me||m.player_b===me)) : [];
    if(needMe.length){
      h += `<div class="sec"><h2>بانتظار تأكيدك</h2><div class="rule"></div>
        <span class="tag violet">${needMe.length}</span></div>
        ${needMe.map(m=>this.board(m,PM)).join('')}`;
    }
    return h;
  },

  standingsHtml(t, ms, ents, PM){
    const table = Engine.standings(ms, ents, t.points);
    const me = Store.me;
    return `<div class="card" style="padding:8px 10px">
      <table class="table">
        <thead><tr>
          <th>#</th><th>اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th>
          <th>له</th><th>عليه</th><th>+/-</th><th>نقاط</th>
        </tr></thead>
        <tbody>
        ${table.map(r=>`<tr class="${r.id===me?'me':''}">
          <td class="rank ${r.rank<=3?'top':''} num">${r.rank}</td>
          <td><div class="pl">${this.av(r.name, r.id===me)}
            <div class="nm"><a href="#/player/${r.id}" style="color:inherit;text-decoration:none">${U.esc(r.name)}</a></div></div></td>
          <td class="num">${r.pld}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
          <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
          <td class="num" style="color:${r.gd>0?'var(--win)':r.gd<0?'var(--lose)':'var(--ink-3)'}"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></td>
          <td class="pts num">${r.pts}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="sec"><h2>الفورمة — آخر 5</h2><div class="rule"></div></div>
    <div class="card">
      ${table.map(r=>{
        const f = Engine.form(ms, r.id, 5).reverse();
        return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)">
          <div class="rank num dim">${r.rank}</div>
          <div class="nm" style="flex:1;font-size:.74rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.name)}</div>
          <span class="form">${f.length ? f.map(x=>`<i class="fchip ${x}">${x==='W'?'ف':x==='D'?'ت':'خ'}</i>`).join('')
            : '<i class="fchip N">—</i>'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="note" style="margin-top:12px">كسر التعادل: النقاط ← فارق الأهداف ← الأهداف المسجلة ← المواجهة المباشرة.</div>`;
  },

  knockoutHtml(t, ms, PM){
    const champ = Engine.champion(ms);
    let h = '';
    if(champ){
      h += `<div class="card" style="text-align:center;padding:16px 14px;margin-bottom:12px;
        background:linear-gradient(150deg,var(--gold-soft),var(--bg-2));border-color:var(--gold-line)">
        <div style="height:84px;display:grid;place-items:center">${this.trophyImg(t.trophy)}</div>
        <div class="eyebrow" style="margin-top:5px">البطل</div>
        <div style="font-size:1.1rem;font-weight:900;color:var(--gold)">${U.esc(PM[champ]?.name||'')}</div>
      </div>`;
    }
    h += this.treeHtml(ms, PM, t);
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    rounds.forEach(r => {
      const list = ms.filter(m=>m.round===r);
      const done = list.filter(m=>m.status==='completed').length;
      h += `<div class="sec" style="margin:16px 0 8px"><h2 style="font-size:.78rem">${Engine.roundLabel(r, ms)}</h2>
        <div class="rule"></div><span class="tag ${done===list.length?'win':''}">${done}/${list.length}</span></div>
        ${list.slice().sort((a,b)=>(a.slot||0)-(b.slot||0)).map(m=>this.board(m,PM)).join('')}`;
    });
    return h;
  },

  tMatchesHtml(t, ms, PM){
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    const cur = this.state.roundView || Engine.currentRound(ms);
    const list = ms.filter(m=>m.round===cur);
    return `<div class="rounds">
      ${rounds.map(r=>{
        const done = ms.filter(m=>m.round===r).every(m=>['completed','cancelled'].includes(m.status));
        const lbl = t.kind==='knockout' ? Engine.roundLabel(r, ms) : 'الجولة ' + r;
        return `<button class="rbtn ${r===cur?'on':''} ${done?'done':''}" onclick="UI.goRound(${r})">${lbl}</button>`;
      }).join('')}
    </div>${list.map(m=>this.board(m,PM)).join('')}`;
  },
  goRound(r){
    this.state.roundView = r; this.render();
    setTimeout(()=>{ const el = document.querySelector('.rbtn.on'); el?.scrollIntoView({inline:'center',block:'nearest'}); },30);
  },

  treeHtml(ms, PM, t){
    const sh = Engine.treeShape(ms);
    if(!sh) return '';
    const champ = Engine.champion(ms);
    const me = Store.me;

    const side = (pid, gf, isW, isL, pens) => {
      const p = PM[pid];
      return `<div class="tr-s ${isW?'w':''} ${isL?'lo':''} ${p?'':'tbd'}">
        <span class="n">${p ? U.esc(p.name) : '—'}${p && p.id===me ? ' •' : ''}</span>
        <span class="g">${gf==null ? '' : gf}${pens!=null?`<sub style="font-size:.5rem">(${pens})</sub>`:''}</span>
      </div>`;
    };

    const cols = sh.cols.map((col, ci) => {
      const cells = col.cells.map((cell, i) => {
        const pos = ci < sh.cols.length - 1 ? (i % 2 === 0 ? 'up' : 'dn') : '';
        if(cell.type === 'bye'){
          return `<div class="tr-cell ${pos}">
            <div class="tr-m bye">
              <div class="tr-tag">عبور مباشر</div>
              ${side(cell.player, null, false, false)}
            </div></div>`;
        }
        const m = cell.m;
        const w = Engine.winnerOf(m);
        const done = m.status === 'completed';
        return `<div class="tr-cell ${pos}">
          <div class="tr-m ${m.status==='live'?'live':''}" onclick="location.hash='#/match/${m.id}'">
            <div class="tr-tag">${done ? (m.result_type==='normal'?'انتهت':'قرار')
              : m.status==='live' ? 'تُلعب الآن'
              : m.status==='disputed' ? 'نزاع'
              : m.status==='pending_confirmation' ? 'بانتظار التأكيد'
              : U.fmtDate(m.match_date)}</div>
            ${side(m.player_a, m.score_a, done && w===m.player_a, done && w && w!==m.player_a, m.pen_a)}
            ${side(m.player_b, m.score_b, done && w===m.player_b, done && w && w!==m.player_b, m.pen_b)}
          </div></div>`;
      }).join('');
      return `<div class="tr-col"><div class="tr-head">${col.name}</div>
        <div class="tr-body">${cells}</div></div>`;
    }).join('');

    const cup = `<div class="tr-cup">
      <div class="ic">${this.trophyImg(t?.trophy || 1)}</div>
      <div class="lb">${champ ? 'البطل' : 'الكأس'}</div>
      ${champ ? `<div class="nm">${U.esc(PM[champ]?.name||'')}</div>`
              : `<div class="nm" style="color:var(--ink-3);font-weight:700;font-size:.62rem">
                   بانتظار النهائي</div>`}
    </div>`;

    return `<div class="tree"><div class="tree-in">${cols}${cup}</div></div>
      ${sh.rounds > 2 ? '<div class="tr-hint">اسحب أفقياً لتصفّح الأدوار</div>' : ''}`;
  },

  chart(title, rows, opt){
    const o = opt || {};
    if(!rows.length) return '';
    const max = Math.max(...rows.map(r => Math.abs(r.v)), 1);
    return `<div class="sec"><h2>${title}</h2><div class="rule"></div>
      ${o.note?`<span class="tag">${o.note}</span>`:''}</div>
    <div class="card">${rows.map(r => `
      <div class="barrow">
        <div class="nm">${U.esc(r.name)}</div>
        <div class="bartrack">
          <div class="barfill ${o.tone||''}" style="width:${Math.max(3, Math.abs(r.v)/max*100)}%"></div>
        </div>
        <div class="v ${o.tone||''}">${r.t != null ? r.t : r.v}</div>
      </div>`).join('')}</div>`;
  },

  statsHtml(t, ms, ents, PM){
    const st = Engine.playerStats(ms, ents).filter(r => r.pld > 0);
    let h = '';
    if(!st.length)
      return h + `<div class="empty" style="margin-top:30px"><h3>لا إحصائيات بعد</h3>
        <p>تظهر هنا فور اعتماد أول نتيجة.</p></div>`;

    const goals = st.reduce((x,r)=> x + r.gf, 0);
    const played = ms.filter(m=>m.status==='completed').length;
    h += `<div class="card" style="margin-bottom:4px"><div class="kpis">
      <div class="kpi"><b class="num">${played}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num">${goals}</b><span>هدف</span></div>
      <div class="kpi"><b class="num">${played?(goals/played).toFixed(1):'0'}</b><span>معدل المباراة</span></div>
      <div class="kpi"><b class="num">${st.length}</b><span>لاعب</span></div>
    </div></div>`;

    const by = (f, dir) => st.slice().sort((a,b)=> dir==='asc' ? a[f]-b[f] : b[f]-a[f]);

    h += this.chart('الأهداف المسجّلة', by('gf').map(r=>({name:r.name, v:r.gf})), {note:'أقوى هجوم'});
    h += this.chart('الأهداف المستقبَلة', by('ga','asc').map(r=>({name:r.name, v:r.ga})), {tone:'red', note:'أقوى دفاع أولاً'});
    h += this.chart('فارق الأهداف', by('gd').map(r=>({name:r.name, v:r.gd,
        t:`<span class="sgn">${r.gd>0?'+':''}${r.gd}</span>`})));
    h += this.chart('نسبة الفوز', by('winPct').map(r=>({name:r.name, v:r.winPct, t:Math.round(r.winPct)+'%'})));
    h += this.chart('متوسط التسجيل', by('avgFor').map(r=>({name:r.name, v:r.avgFor, t:r.avgFor.toFixed(2)})), {note:'هدف لكل مباراة'});
    h += this.chart('متوسط الاستقبال', by('avgAgainst','asc').map(r=>({name:r.name, v:r.avgAgainst, t:r.avgAgainst.toFixed(2)})), {tone:'red'});

    const cs = by('clean').filter(r=>r.clean>0);
    if(cs.length) h += this.chart('الشباك النظيفة', cs.map(r=>({name:r.name, v:r.clean})), {tone:'dim'});
    const sk = by('streak').filter(r=>r.streak>1);
    if(sk.length) h += this.chart('أطول سلسلة انتصارات', sk.map(r=>({name:r.name, v:r.streak, t:r.streak+' متتالية'})));

    h += `<div class="sec"><h2>التفاصيل الكاملة</h2><div class="rule"></div></div>
    <div class="card" style="padding:8px 10px">
      <table class="table"><thead><tr>
        <th>اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th>
        <th>له</th><th>عليه</th><th>نظيفة</th><th>أكبر فوز</th>
      </tr></thead><tbody>
      ${by('gf').map(r=>`<tr class="${r.id===Store.me?'me':''}"
        onclick="location.hash='#/player/${r.id}'" style="cursor:pointer">
        <td style="text-align:right"><div class="pl">${this.av(r.name, r.id===Store.me)}
          <div class="nm">${U.esc(r.name)}</div></div></td>
        <td class="num">${r.pld}</td><td class="num">${r.w}</td>
        <td class="num">${r.d}</td><td class="num">${r.l}</td>
        <td class="num" style="color:var(--gold)">${r.gf}</td>
        <td class="num" style="color:var(--lose)">${r.ga}</td>
        <td class="num">${r.clean}</td>
        <td class="num tiny">${r.bestTxt}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>
    <div class="note" style="margin-top:12px">المباريات المحسومة إدارياً لا تدخل في هذه الأرقام
      حتى لا تشوّه المعدلات.</div>`;
    return h;
  },

  /* ═══════════ مركز المباريات ═══════════ */
  async viewMatchCenter(){
    const all = await Store.tournaments();
    const TN = {}; all.forEach(t => TN[t.id] = t);
    const PM = await this.playersMap();
    const today = U.today();
    const f = this.state.mf || 'all';

    let ms = Store.allMatches().filter(m => m.status !== 'cancelled');
    if(f === 'today')  ms = ms.filter(m => m.match_date === today);
    if(f === 'next')   ms = ms.filter(m => !['completed'].includes(m.status) && m.match_date >= today);
    if(f === 'done')   ms = ms.filter(m => m.status === 'completed');
    if(f === 'mine' && Store.me)
      ms = ms.filter(m => m.player_a === Store.me || m.player_b === Store.me);

    const asc = f === 'done' ? -1 : 1;
    ms.sort((a,b)=> asc * ((a.match_date+a.match_time).localeCompare(b.match_date+b.match_time)));

    const counts = {
      all: Store.allMatches().filter(m=>m.status!=='cancelled').length,
      today: Store.allMatches().filter(m=>m.match_date===today && m.status!=='cancelled').length,
      done: Store.allMatches().filter(m=>m.status==='completed').length
    };

    let h = `<div class="phead">
      <h1>المباريات</h1>
      <div class="sub">${counts.all} مباراة في ${all.length} بطولة</div>
    </div>
    <div class="filters">
      ${[['all','الكل',counts.all],['today','اليوم',counts.today],
         ['next','القادمة',''],['done','النتائج',counts.done],
         ...(Store.me ? [['mine','مبارياتي','']] : [])]
        .map(([k,l,c])=>`<button class="fbtn ${k===f?'on':''}" onclick="UI.mfilter('${k}')">
          ${l}${c!=='' ? `<i>${c}</i>` : ''}</button>`).join('')}
    </div>`;

    if(!ms.length)
      return h + `<div class="empty" style="margin-top:26px"><h3>لا مباريات هنا</h3>
        <p>جرّب تصفية أخرى.</p></div>`;

    const days = [];
    ms.forEach(m => {
      const d = days.find(x => x.d === m.match_date);
      if(d) d.list.push(m); else days.push({ d:m.match_date, list:[m] });
    });

    days.forEach(day => {
      h += `<div class="daybar"><b>${U.fmtDate(day.d)}</b>
        <div class="ln"></div><span class="cnt">${day.list.length} مباراة</span></div>`;
      h += day.list.map(m => {
        const t = TN[m.tournament_id];
        const isCup = t?.kind === 'knockout';
        const done = m.status === 'completed';
        const st = CFG.STATUS[m.status];
        const rn = isCup ? '' : 'الجولة ' + m.round;
        return `<button class="mcard" onclick="location.hash='#/match/${m.id}'">
          <div style="flex:1;min-width:0">
            <div class="trn">${U.esc(t?.name||'')}${rn ? ' · ' + rn : ''}</div>
            <div class="who">${U.esc(PM[m.player_a]?.name || 'بانتظار الفائز')}</div>
            <div class="who">${U.esc(PM[m.player_b]?.name || 'بانتظار الفائز')}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
            <div class="rs ${done ? '' : 'soon'}">${done
              ? `${m.score_a} <span class="dim">–</span> ${m.score_b}`
              : (m.player_a && m.player_b ? U.fmtTime(m.match_time) : '—')}</div>
            <span class="tag ${st.cls}" style="font-size:.52rem;padding:2px 7px">
              ${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</span>
          </div>
        </button>`;
      }).join('');
    });
    return h;
  },
  mfilter(v){ this.state.mf = v; this.render(); },

  /* ═══════════ الإحصائيات العامة ═══════════ */
  async viewStats(){
    const players = await Store.players();
    const trns = (await Store.tournaments()).filter(t => (t.game||'fc') === 'fc');
    const ids = new Set(trns.map(t=>t.id));
    const ents = Store.allEntries().filter(e => ids.has(e.tournament_id));
    const mts  = Store.allMatches().filter(m => ids.has(m.tournament_id));
    const rows = Engine.careerStats(players, trns, ents, mts).filter(r => r.trns > 0);

    if(!rows.length)
      return `<div class="phead"><h1>الإحصائيات</h1></div>
        <div class="empty" style="margin-top:26px"><h3>لا بيانات بعد</h3>
        <p>تظهر هنا بعد انطلاق أول بطولة.</p></div>`;

    const key = this.state.sk || 'w';
    const cols = [
      ['name','اللاعب'],['trns','بطولات'],['titles','ألقاب'],['pld','لعب'],
      ['w','ف'],['d','ت'],['l','خ'],['gf','له'],['ga','عليه'],['gd','+/-']
    ];
    const asc = ['name','l','ga'].includes(key);
    rows.sort((a,b)=>{
      if(!a.pld !== !b.pld) return a.pld ? -1 : 1;
      if(key === 'name') return a.name.localeCompare(b.name,'ar');
      const d = asc ? a[key] - b[key] : b[key] - a[key];
      if(d) return d;
      return b.w - a.w || b.gf - a.gf || b.gd - a.gd
          || b.titles - a.titles || a.pld - b.pld
          || a.name.localeCompare(b.name,'ar');
    });

    const totals = rows.reduce((x,r)=>({ pld:x.pld+r.pld, gf:x.gf+r.gf }), {pld:0,gf:0});

    return `<div class="phead">
      <h1>الإحصائيات</h1>
      <div class="sub">${U.esc(CFG.BRAND.game)} · ${rows.length} لاعب</div>
    </div>
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><b class="num">${rows.length}</b><span>لاعب</span></div>
      <div class="kpi"><b class="num">${trns.length}</b><span>بطولة</span></div>
      <div class="kpi"><b class="num">${totals.pld/2|0}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num">${totals.gf}</b><span>هدف</span></div>
    </div>
    <div class="tiny dim" style="margin-bottom:7px">مرتّبة حسب
      <b style="color:var(--gold)">${cols.find(c=>c[0]===key)[1]}</b> —
      اضغط رأس أي عمود لتغييره، وعلى اللاعب لملفه.</div>
    <div class="card" style="padding:8px 10px">
      <table class="table sortable">
        <thead><tr><th>#</th>${cols.map(([k,l])=>
          `<th class="${k===key?'on':''}" onclick="UI.sortStats('${k}')">${l}</th>`).join('')}</tr></thead>
        <tbody>
        ${rows.map((r,i)=>`<tr class="${r.id===Store.me?'me':''}"
          onclick="location.hash='#/player/${r.id}'" style="cursor:pointer">
          <td class="rank ${i<3?'top':''} num">${i+1}</td>
          <td style="text-align:right"><div class="pl">${this.av(r.name, r.id===Store.me)}
            <div class="nm">${U.esc(r.name)}</div></div></td>
          <td class="num">${r.trns}</td>
          <td class="num" style="color:${r.titles?'var(--gold)':'inherit'}">${r.titles || '—'}</td>
          <td class="num">${r.pld}</td><td class="num">${r.w}</td>
          <td class="num">${r.d}</td><td class="num">${r.l}</td>
          <td class="num" style="color:var(--gold)">${r.gf}</td>
          <td class="num" style="color:var(--lose)">${r.ga}</td>
          <td class="num"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="note" style="margin-top:12px">الأرقام مجمّعة من بطولات ${U.esc(CFG.BRAND.game)} فقط.
      المباريات المحسومة إدارياً تُحتسب في النتائج ولا تدخل في الأهداف.</div>`;
  },
  sortStats(k){ this.state.sk = k; this.render(); },

    const tids = new Set(trns.map(t=>t.id));

    const mts  = Store.allMatches().filter(m => tids.has(m.tournament_id));
    const PM = await this.playersMap();
    const r = Engine.careerStats(players, trns, ents, mts).find(x => x.id === id);
    const mine = mts.filter(m => (m.player_a===id||m.player_b===id) && m.status === 'completed')

    let h = `<div class="phead" style="align-items:center">

      <span class="tag gold" dir="ltr">${U.esc(p.game_id)}</span>${this.plat(p.platform)}</div>`;

    h += `<div class="sec"><h2>⚽ ${U.esc(CFG.BRAND.game)}</h2><div class="rule"></div></div>
    <div class="card"><div class="kpis">
      <div class="kpi"><b class="num">${r.pld}</b><span>مباراة</span></div>

      <div class="kpi"><b class="num">${r.d}</b><span>تعادل</span></div>
      <div class="kpi"><b class="num" style="color:var(--lose)">${r.l}</b><span>خسارة</span></div>
    </div>
    <div class="kpis" style="margin-top:7px">
      <div class="kpi"><b class="num" style="color:var(--gold)">${r.gf}</b><span>له</span></div>
      <div class="kpi"><b class="num" style="color:var(--lose)">${r.ga}</b><span>عليه</span></div>
      <div class="kpi"><b class="num"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></b><span>فارق</span></div>
      <div class="kpi"><b class="num">${Math.round(r.winPct)}%</b><span>نسبة الفوز</span></div>
    </div></div>`;

    if(r.titles){
      const won = trns.filter(t => Engine.titleHolder(t,
        mts.filter(m=>m.tournament_id===t.id),
        ents.filter(e=>e.tournament_id===t.id)
          .map(e=>({...e, player: players.find(pp=>pp.id===e.player_id)})).filter(e=>e.player)) === id);
      h += `<div class="sec"><h2>الألقاب</h2><div class="rule"></div>
        <span class="tag gold">${r.titles}</span></div>`;
      h += won.map(t=>`<button class="tcard" onclick="location.hash='#/t/${t.id}'">
        <div class="cup">${this.trophyImg(t.trophy)}</div>
        <div class="body"><div class="ttl">${U.esc(t.name)}</div>
          <div class="facts"><span>${CFG.kindLabel(t.game||'fc', t.kind)}</span></div></div>
        <div class="go">‹</div></button>`).join('');

    if(myTrns.length){
      h += `<div class="sec"><h2>المشاركات</h2><div class="rule"></div>
        <span class="tag">${myTrns.length}</span></div><div class="card">
        ${myTrns.map(tid=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;

          <div class="nm" style="flex:1;font-size:.72rem;font-weight:800">${U.esc(TN[tid]?.name||'')}</div>

        </div>`).join('')}</div>`;

    if(mine.length){
      h += `<div class="sec"><h2>آخر نتائج ${U.esc(CFG.BRAND.game)}</h2><div class="rule"></div></div>
        ${mine.map(m=>this.board(m,PM)).join('')}`;
    }

    /* ── أقسام الألعاب الأخرى — منفصلة تماماً، بلا أي جمع ── */
    for(const gk of CFG.SECONDARY){
      const G = CFG.GAMES[gk];
      const gts = (await Store.tournaments()).filter(t => t.game === gk);
      if(!gts.length) continue;
      const gEnts = Store.gameEntries(gk);
      if(!gEnts.some(e => e.player_id === id)) continue;
      const gr = Engine.wkCareer(players, gts, gEnts, Store.gameMatches(gk)).find(x => x.id === id);
      if(!gr) continue;

      h += `<div class="sec"><h2><span class="ginline">${CFG.gameIcon(gk)}</span> ${U.esc(G.name)}</h2><div class="rule"></div>
        ${G.sub ? `<span class="tag">${U.esc(G.sub)}</span>` : ''}

      <div class="card"><div class="kpis">
        <div class="kpi"><b class="num">${gr.trns}</b><span>بطولة</span></div>
        <div class="kpi"><b class="num">${gr.pld}</b><span>مباراة</span></div>
        <div class="kpi"><b class="num" style="color:var(--gold)">${gr.wins}</b><span>Wins</span></div>
        <div class="kpi"><b class="num" style="color:var(--lose)">${gr.kills}</b><span>Kills</span></div>
      </div></div>`;
    }

    h += `<div class="note" style="margin-top:14px">
      إحصائيات كل لعبة مستقلة تماماً ولا تُجمع مع غيرها.</div>`;
    return h;
  },

  async viewMatch(id){

    const me = Store.me, adm = Store.isAdmin;
    const isMine = me && (me === m.player_a || me === m.player_b);
    const st = CFG.STATUS[m.status];
    this._evd = (m.score_a != null) ? await Store.evidence(m.id) : [];

    const ms0 = await Store.matches(m.tournament_id);
    this.cacheRoundNames(t, ms0);
    const rname = t.kind === 'knockout' ? Engine.roundLabel(m.round, ms0) : `الجولة ${m.round}`;

    /* ترويسة الغرفة — زر الإدارة هنا وحده، بعيداً تماماً عن الدردشة */
