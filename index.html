    if(!m.player_a || !m.player_b){
      h += `<div class="note">تُحدَّد أطراف هذه المباراة بعد انتهاء الدور السابق،
        وتُفتح الدردشة فور تحديدهما.</div>`;
    }

    /* اللوحة */
    h += `<div class="card" style="text-align:center;background:linear-gradient(150deg,var(--surface),var(--bg-2))">
      <div class="tag ${st.cls}" style="margin-bottom:12px">${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</div>
      <div class="board-grid" style="align-items:start">
        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(A?.name, A?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(A?.name||'—')}</div>
          ${A?.game_id?`<div class="tiny dim" dir="ltr">${U.esc(A.game_id)}</div>`:''}
        </div>
        <div class="score" style="font-size:1.7rem;min-width:96px">
          ${m.score_a==null ? '<span class="dim" style="font-size:1rem">—</span>' : `${m.score_a} <span class="dim">–</span> ${m.score_b}`}
        </div>
        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(B?.name, B?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(B?.name||'—')}</div>
          ${B?.game_id?`<div class="tiny dim" dir="ltr">${U.esc(B.game_id)}</div>`:''}
        </div>
      </div>
      <div class="tiny dim" style="margin-top:12px">${U.fmtDate(m.match_date)} · ${U.fmtTime(m.match_time)}</div>
      ${m.result_type==='walkover' ? `<div class="tag" style="margin-top:8px">فوز بالانسحاب</div>` : ''}
      ${m.result_type==='decision' ? `<div class="tag" style="margin-top:8px">
        حُسمت إدارياً${m.decision_reason?' · '+U.esc(m.decision_reason):''}</div>` : ''}
    </div>`;

    /* الجاهزية */
    if(['scheduled','live'].includes(m.status) && m.player_a && m.player_b){
      h += `<div class="sec"><h2>الجاهزية</h2><div class="rule"></div>
        ${m.attend_a && m.attend_b ? '<span class="tag win">🎮 الطرفان جاهزان</span>' : ''}</div>
      <div class="ready">
        ${[[m.player_a,'attend_a'],[m.player_b,'attend_b']].map(([pid,key])=>`
          <div class="p ${m[key]?'on':''}">
            <div class="nm">${U.esc(PM[pid]?.name||'—')}</div>
            <div class="st">${m[key]?'🟢 جاهز':'⚪ غير جاهز'}</div>
          </div>`).join('')}
      </div>
      ${isMine && !m[me===m.player_a?'attend_a':'attend_b'] ?
        `<button class="btn ok full" onclick="UI.attend('${m.id}')">✅ أنا جاهز</button>` : ''}
      ${m.attend_a && m.attend_b && m.status==='scheduled' && (isMine||adm) ?
        `<button class="btn solid full" style="margin-top:8px" onclick="UI.setStatus('${m.id}','live')">
          ابدأ المباراة</button>` : ''}`;
    }

    /* الدردشة — لطرفَي المباراة والمشرف */
    if((isMine || adm) && Store.session){
      h += `<div class="sec"><h2>💬 دردشة المباراة</h2><div class="rule"></div></div>${this.chatBox(m, isMine)}`;
      this._chatFor = this.chatState(m).open ? m.id : null;
    } else {
      this._chatFor = null;
    }

    /* تسجيل النتيجة — نموذج مختلف لكل نوع تسجيل */
    if(['scheduled','live'].includes(m.status) && (isMine || adm) && m.player_a && m.player_b){
      const wk = CFG.GAMES[t.game || 'fc']?.scoring === 'wk';
      h += `<div class="sec"><h2>تسجيل النتيجة</h2><div class="rule"></div>
        ${wk ? `<span class="tag">${U.esc(CFG.GAMES[t.game].name)}</span>` : ''}</div>
      <div class="card">`;

      if(wk){
        h += `<div class="note">🏆 <b>Wins</b> يحدّد الفائز، و💀 <b>Kills</b> يكسر التعادل عند تساويهما.</div>
        <div class="wkentry">
          ${[[A,'wa','ka'],[B,'wb','kb']].map(([P,w,k])=>`
            <div class="wkside">
              <div class="who">${U.esc(P?.name||'—')}</div>
              <label class="wklab">🏆 Wins</label>
              <div class="stepper">
                <button onclick="UI.step('${w}',1)">+</button>
                <input class="num" id="${w}" type="number" inputmode="numeric" min="0" value="0">
                <button onclick="UI.step('${w}',-1)">−</button>
              </div>
              <label class="wklab" style="margin-top:8px">💀 Kills</label>
              <div class="stepper">
                <button onclick="UI.step('${k}',1)">+</button>
                <input class="num" id="${k}" type="number" inputmode="numeric" min="0" value="0">
                <button onclick="UI.step('${k}',-1)">−</button>
              </div>
            </div>`).join('<div class="vs" style="padding-top:0;align-self:center">VS</div>')}
        </div>`;
      } else {
        h += `<div class="entry">
          <div>
            <div class="who">${U.esc(A?.name||'—')}</div>
            <div class="stepper">
              <button onclick="UI.step('sa',1)">+</button>
              <input class="num" id="sa" type="number" inputmode="numeric" min="0" max="99" value="0" oninput="UI.penToggle()">
              <button onclick="UI.step('sa',-1)">−</button>
            </div>
          </div>
          <div class="vs">VS</div>
          <div>
            <div class="who">${U.esc(B?.name||'—')}</div>
            <div class="stepper">
              <button onclick="UI.step('sb',1)">+</button>
              <input class="num" id="sb" type="number" inputmode="numeric" min="0" max="99" value="0" oninput="UI.penToggle()">
              <button onclick="UI.step('sb',-1)">−</button>
            </div>
          </div>
        </div>
        ${t.kind === 'knockout' ? `
        <div id="pens" style="display:none;margin-top:11px">
          <div class="note warn">لا تعادل في الكأس — أدخل ركلات الترجيح.</div>
          <div class="entry">
            <div><div class="who">${U.esc(A?.name||'—')}</div>
              <div class="stepper"><button onclick="UI.step('pa',1)">+</button>
              <input class="num" id="pa" type="number" inputmode="numeric" min="0" value="0">
              <button onclick="UI.step('pa',-1)">−</button></div></div>
            <div class="vs">ركلات</div>
            <div><div class="who">${U.esc(B?.name||'—')}</div>
              <div class="stepper"><button onclick="UI.step('pb',1)">+</button>
              <input class="num" id="pb" type="number" inputmode="numeric" min="0" value="0">
              <button onclick="UI.step('pb',-1)">−</button></div></div>
          </div>
        </div>` : ''}`;
      }

      h += `<div class="field" style="margin-top:12px">
          <label>إثبات النتيجة <span class="dim">(اختياري — يُحفظ دائماً ولا يُحذف مع الدردشة)</span></label>
          <input class="input" type="file" accept="image/*" id="evd" onchange="UI.pickEvidence(event)">
          <div class="evd" id="evdprev"></div>
        </div>
        <button class="btn solid full" onclick="UI.report('${m.id}')">سجّل النتيجة</button>
        <div class="tiny dim center" style="margin-top:8px">تُرسل للخصم للموافقة قبل اعتمادها في الجدول.</div>
      </div>`;
    }

    /* تأكيد الخصم */
    if(m.status === 'pending_confirmation'){
      const reporter = PM[m.reported_by];
      const iMustConfirm = isMine && m.reported_by !== me;
      h += `<div class="sec"><h2>تأكيد النتيجة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note violet">سجّل <b>${U.esc(reporter?.name||'—')}</b> النتيجة ${m.score_a} – ${m.score_b}
          ${m.reported_at?`<div class="tiny dim" style="margin-top:4px">${U.fmtStamp(m.reported_at)}</div>`:''}</div>
        ${this.evidenceHtml()}
        ${iMustConfirm ? `
          <div class="row" style="margin-top:11px">
            <button class="btn ok" style="flex:1" onclick="UI.confirm('${m.id}')">أوافق</button>
            <button class="btn danger" style="flex:1" onclick="UI.disputeSheet('${m.id}')">أعترض</button>
          </div>`
        : `<div class="tiny dim center" style="margin-top:10px">
            بانتظار موافقة ${U.esc(PM[m.reported_by===m.player_a?m.player_b:m.player_a]?.name||'الخصم')}.
          </div>`}
      </div>`;
    }

    /* نزاع */
    if(m.status === 'disputed'){
      h += `<div class="sec"><h2>نزاع على المباراة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note warn">اللاعبان سجّلا نتيجتين مختلفتين. القرار للإدارة.</div>
        <div class="row" style="gap:9px">
          ${[['النتيجة الأولى',m.score_a,m.score_b,m.reported_by],
             ['اعتراض الخصم',m.claim_a,m.claim_b,m.claim_by]].map(([lbl,x,y,by])=>`
            <div style="flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center">
              <div class="tiny dim" style="font-weight:800">${lbl}</div>
              <div class="num" style="font-size:1.2rem;font-weight:800;margin:4px 0">${x} – ${y}</div>
              <div class="tiny dim">${U.esc(PM[by]?.name||'—')}</div>
            </div>`).join('')}
        </div>
        ${this.evidenceHtml()}
        ${adm ? `<div class="tiny dim center" style="margin-top:11px">
            استخدم زر «⋮» في أعلى الصفحة لحسم النزاع.</div>`
          : `<div class="tiny dim center" style="margin-top:10px">بانتظار قرار الإدارة.</div>`}
      </div>`;
    }

    /* مكتملة */
    if(m.status === 'completed'){
      const w = Engine.winnerOf(m);
      h += `<div class="card">
        ${t.kind === 'knockout' && w ? `<div class="tag gold" style="margin-bottom:9px">
          🏆 تأهّل ${U.esc(PM[w]?.name||'')}</div>` : ''}
        <div class="tiny dim">اعتُمدت ${U.fmtStamp(m.confirmed_at)}${m.confirmed_by_admin?' — بقرار إداري':''}</div>
        ${this.evidenceHtml()}
      </div>`;
    }

    /* التأجيل */
    if(!['completed','cancelled'].includes(m.status)){
      h += `<div class="sec"><h2>التأجيل</h2><div class="rule"></div></div><div class="card">`;
      if(m.postpone && !m.postpone.agreed){
        const byMe = m.postpone.by === me;
        h += `<div class="note">طلب <b>${U.esc(PM[m.postpone.by]?.name||'—')}</b> التأجيل إلى
          ${U.fmtDate(m.postpone.date)} ${U.fmtTime(m.postpone.time)}</div>`;
        if(isMine && !byMe)
          h += `<div class="row"><button class="btn ok" style="flex:1" onclick="UI.agreePostpone('${m.id}')">أوافق على التأجيل</button>
                <button class="btn danger" style="flex:1" onclick="UI.rejectPostpone('${m.id}')">أرفض</button></div>`;
        else h += `<div class="tiny dim center">بانتظار موافقة الخصم.</div>`;
      } else if(isMine){
        h += `<button class="btn full" onclick="UI.postponeSheet('${m.id}')">اطلب تأجيل المباراة</button>
              <div class="tiny dim center" style="margin-top:7px">يُنفَّذ فوراً عند موافقة الطرفين.</div>`;
      } else {
        h += `<div class="tiny dim center">لا توجد طلبات تأجيل.</div>`;
      }
      h += `</div>`;
    }

    /* سجل المباراة */
    const logs = await Store.auditLog(m.tournament_id, m.id);
    if(logs.length){
      h += `<div class="sec"><h2>سجل المباراة</h2><div class="rule"></div></div>
      <div class="card">${logs.map(l=>`<div class="log">
        <time>${U.fmtStamp(l.created_at)}</time>
        <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
      </div>`).join('')}</div>`;
    }
    return h;
  },

  /* ── نافذة إدارة المباراة — معزولة تماماً عن الدردشة ── */
  async adminSheet(id){
    const m = await Store.match(id);
    const PM = await this.playersMap();
    const rows = [];
    if(m.status === 'disputed'){
      rows.push(`<div class="note warn">نزاع مفتوح — اعتمد إحدى النتيجتين.</div>
        <div class="row" style="margin-bottom:10px">
          <button class="btn ok" style="flex:1" onclick="UI.resolve('${id}','reported')">
            اعتماد ${m.score_a} – ${m.score_b}</button>
          <button class="btn ok" style="flex:1" onclick="UI.resolve('${id}','claim')">
            اعتماد ${m.claim_a} – ${m.claim_b}</button>
        </div>`);
    }
    if(m.status === 'pending_confirmation')
      rows.push(`<button class="btn ok full" style="margin-bottom:8px" onclick="UI.confirm('${id}',true)">
        ✅ اعتماد النتيجة إدارياً</button>`);
    if(m.status === 'completed')
      rows.push(`<button class="btn full" style="margin-bottom:8px" onclick="UI.reopen('${id}')">
        ↩︎ إعادة فتح النتيجة</button>`);

    this.sheet('إدارة المباراة', `
      <div class="tiny dim" style="margin-bottom:12px">
        ${U.esc(PM[m.player_a]?.name||'—')} × ${U.esc(PM[m.player_b]?.name||'—')}
      </div>
      ${rows.join('')}
      <button class="btn full" style="margin-bottom:8px" onclick="UI.rescheduleSheet('${id}')">
        🟡 تعديل الموعد</button>
      <button class="btn full" style="margin-bottom:8px" onclick="UI.postponeSheet('${id}')">
        ⏳ طلب تأجيل</button>
      <button class="btn full" style="margin-bottom:8px" onclick="UI.walkoverSheet('${id}')">
        🟠 حسم إداري</button>
      ${m.status!=='cancelled'
        ? `<button class="btn danger full" style="margin-bottom:8px" onclick="UI.setStatus('${id}','cancelled')">
             🔴 إلغاء المباراة</button>`
        : `<button class="btn full" style="margin-bottom:8px" onclick="UI.replay('${id}')">
             إعادة تفعيل المباراة</button>`}
      ${m.status!=='completed' && m.status!=='cancelled'
        ? `<button class="btn full" onclick="UI.replay('${id}')">🔄 إعادة المباراة للجدول</button>` : ''}
      <div class="tiny dim center" style="margin-top:12px">
        هذه الإجراءات حسّاسة ومفصولة عمداً عن منطقة الدردشة.</div>`);
  },

  /* ── حالة الدردشة — مطابقة تماماً لسياسة القاعدة ── */
  chatState(m){
    if(m.status === 'cancelled') return { open:false, why:'cancelled' };
    if(m.status === 'completed') return { open:false, why:'done' };
    if(!m.player_a || !m.player_b) return { open:false, why:'tbd' };
    return { open:true };
  },

  chatBox(m, canWrite){
    const st = this.chatState(m);
    if(!st.open){
      const txt = st.why === 'done'
        ? `<b>أُغلقت الدردشة</b>تُحذف رسائل المباراة تلقائياً بعد اعتماد النتيجة`
        : st.why === 'cancelled' ? `<b>المباراة ملغاة</b>الدردشة مغلقة`
        : `<b>بانتظار تحديد الطرفين</b>تُفتح الدردشة فور معرفة اللاعبين`;
      return `<div class="chat"><div class="chat-head"><b>دردشة المباراة</b></div>
        <div class="chat-shut">${txt}</div></div>`;
    }
    const bar = canWrite ? `
      <div class="quick">
        ${CFG.QUICK.map(q=>`<button class="qbtn" onclick="UI.quickSend('${m.id}',this)">${q}</button>`).join('')}
      </div>
      <div class="chat-bar">
        <input id="chatin" placeholder="اكتب رسالة…" maxlength="500"
          onkeydown="if(event.key==='Enter')UI.sendChat('${m.id}')">
        <div id="recbar" style="display:none"><div class="reclive">
          <i class="dot pulse"></i> جارٍ التسجيل <span class="t" id="rectime">00:00</span>
        </div></div>
        <div class="chat-acts" id="chatacts">
          <input type="file" accept="image/*" id="chatimg" style="display:none"
            onchange="UI.pickChatImage(event,'${m.id}')">
          <button class="imgbtn" onclick="document.getElementById('chatimg').click()"
            title="إرسال صورة">📷</button>
          <button class="mic" id="micbtn"
            onpointerdown="UI.micDown(event,'${m.id}')"
            onpointermove="UI.micMove(event)"
            onpointerup="UI.micUp(event)"
            onpointercancel="UI.micUp(event,true)"
            oncontextmenu="return false">🎙️ اضغط للتحدث</button>
          <button class="send" onclick="UI.sendChat('${m.id}')">إرسال</button>
        </div>
      </div>`
      : `<div class="chat-shut" style="border-top:1px solid var(--line)">
           تطّلع كمشرف — لا يمكنك الكتابة في دردشة لست طرفاً فيها</div>`;

    return `<div class="chat">
      <div class="chat-head">
        <b>دردشة المباراة</b>
        <span class="tag win"><i class="dot"></i>مفتوحة</span>
      </div>
      <div class="chat-log" id="chatlog"><div class="chat-shut">جارٍ التحميل…</div></div>
      ${bar}</div>
      <div class="tiny dim center" style="margin-top:7px">
        خاصة بطرفَي المباراة والمشرف · تُحذف تلقائياً بعد اعتماد النتيجة</div>`;
  },

  async loadChat(matchId, PM){
    const box = document.getElementById('chatlog');
    if(!box) return;
    const msgs = await Store.messages(matchId);
    box.innerHTML = msgs.length ? msgs.map(x=>{
      const mine = x.player_id === Store.me;
      const time = U.fmtStamp(x.created_at).split('· ')[1] || '';
      const head = mine ? '' : `<div class="who">${U.esc(PM[x.player_id]?.name || '—')}</div>`;
      if(x.kind === 'voice'){
        return `<div class="msg ${mine?'mine':''}">${head}
          <div class="vmsg">
            <button class="vplay" id="vp_${x.id}" onclick="UI.playVoice('${x.id}','${x.audio_path}')">▶</button>
            <div class="vwave">${Array.from({length:18},()=>'<i></i>').join('')}</div>
            <span class="vdur">${U.clock(x.duration_ms||0)}</span>
          </div>
          <time>${time}</time></div>`;
      }
      if(x.kind === 'image'){
        return `<div class="msg ${mine?'mine':''} imgmsg">${head}
          <div class="cimg" onclick="UI.openChatImage('${x.image_path}')">
            <img data-p="${x.image_path}" alt="صورة">
            <span class="ld">جارٍ التحميل…</span>
          </div>
          <time>${time}</time></div>`;
      }
      return `<div class="msg ${mine?'mine':''}">${head}${U.esc(x.body)}<time>${time}</time></div>`;
    }).join('') : `<div class="chat-shut">لا رسائل بعد. ابدأ أنت.</div>`;

    /* روابط الصور موقّعة ومؤقتة — تُجلب بعد الرسم */
    for(const el of box.querySelectorAll('img[data-p]')){
      Store.imageUrl(el.dataset.p).then(u => {
        if(!u) return;
        el.src = u;
        el.onload = () => el.parentNode.querySelector('.ld')?.remove();
      });
    }
    box.scrollTop = box.scrollHeight;
  },

  async sendChat(matchId){
    const el = document.getElementById('chatin');
    const v = (el.value || '').trim();
    if(!v) return;
    el.value = '';
    try{
      await Store.sendMessage(matchId, v);
      await this.loadChat(matchId, await this.playersMap());
    }catch(e){ el.value = v; this.toast(e.message,'err'); }
  },

  async quickSend(matchId, btn){
    const txt = btn.textContent.trim();
    btn.disabled = true;
    try{
      await Store.sendMessage(matchId, txt);
      await this.loadChat(matchId, await this.playersMap());
    }catch(e){ this.toast(e.message,'err'); }
    btn.disabled = false;
  },

  /* ── الرسائل الصوتية — اضغط مع الاستمرار ──
     ملاحظة أساسية: طلب إذن الميكروفون غير متزامن. لو رُفع الإصبع أثناء
     الانتظار، لا بد أن نعرف ذلك — لذا نرفع علم _holding فوراً (متزامناً)
     ونفحصه بعد انتهاء الانتظار قبل بدء التسجيل فعلياً. */
  _rec: null, _holding: false, _starting: false,

  async micDown(ev, matchId){
    ev.preventDefault();
    if(this._rec || this._starting) return;
    if(!navigator.mediaDevices?.getUserMedia)
      return this.toast('التسجيل غير مدعوم في هذا المتصفح','err');

    this._holding  = true;      // متزامن — قبل أي await
    this._starting = true;
    this._moved    = false;
    this._y0 = ev.clientY;

    /* التقاط المؤشر: يضمن وصول pointerup للزر حتى لو تحرّك الإصبع */
    try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}

    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }catch(e){
      this._starting = false; this._holding = false;
      return this.toast('تعذّر الوصول للميكروفون','err');
    }

    this._starting = false;

    /* رُفع الإصبع أثناء انتظار الإذن → لا تسجّل إطلاقاً */
    if(!this._holding){
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    try{
      const mr = new MediaRecorder(stream);
      const chunks = [];
      mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      this._rec = { mr, chunks, stream, matchId, t0:Date.now() };
      mr.start();

      const mic = document.getElementById('micbtn');
      if(mic) mic.classList.add('rec');
      const acts = document.getElementById('chatacts'); if(acts) acts.style.display = 'none';
      const rb = document.getElementById('recbar');     if(rb) rb.style.display = '';

      this._recTimer = setInterval(()=>{
        if(!this._rec) return;
        const ms = Date.now() - this._rec.t0;
        const el = document.getElementById('rectime');
        if(el) el.textContent = U.clock(ms);
        if(ms >= CFG.VOICE_MAX_MS) this.micUp(null);   // الحد الأقصى
      }, 200);
    }catch(e){
      stream.getTracks().forEach(t => t.stop());
      this._holding = false;
      this.toast('تعذّر بدء التسجيل','err');
    }
  },

  /* اسحب لأعلى أثناء التسجيل للإلغاء */
  micMove(ev){
    if(!this._rec || this._moved) return;
    if(this._y0 - ev.clientY > 70){
      this._moved = true;
      const el = document.getElementById('rectime');
      if(el) el.textContent = 'أفلت للإلغاء';
    }
  },

  micUp(ev, cancel){
    this._holding = false;                 // يوقف بدءاً لم يكتمل بعد
    if(this._starting) return;              // micDown سيرى العلم ويتراجع
    if(!this._rec) return;

    const r = this._rec; this._rec = null;
    clearInterval(this._recTimer);
    const dur = Date.now() - r.t0;
    const abort = cancel || this._moved;
    this._moved = false;

    const mic = document.getElementById('micbtn');
    if(mic) mic.classList.remove('rec');
    const acts = document.getElementById('chatacts'); if(acts) acts.style.display = '';
    const rb = document.getElementById('recbar');
    if(rb){ rb.style.display = 'none'; }
    const rt = document.getElementById('rectime'); if(rt) rt.textContent = '00:00';

    r.mr.onstop = async () => {
      r.stream.getTracks().forEach(t => t.stop());
      if(abort) return;
      if(dur < 600) return this.toast('اضغط مطوّلاً للتسجيل');
      const blob = new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' });
      try{
        await Store.sendVoice(r.matchId, blob, dur);
        await this.loadChat(r.matchId, await this.playersMap());
      }catch(e){ this.toast(e.message,'err'); }
    };
    try{ r.mr.stop(); }catch(e){}
  },

  /* ── صور الدردشة — مؤقتة، تُحذف مع الدردشة ── */
  async pickChatImage(ev, matchId){
    const f = ev.target.files?.[0];
    ev.target.value = '';
    if(!f) return;
    if(!f.type.startsWith('image/')) return this.toast('اختر صورة','err');
    this.toast('جارٍ الإرسال…');
    try{
      const blob = await this.compressToBlob(f);
      await Store.sendImage(matchId, blob);
      await this.loadChat(matchId, await this.playersMap());
    }catch(e){ this.toast(e.message,'err'); }
  },

  compressToBlob(file){
    return new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1280, sc = Math.min(1, max/Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => b ? res(b) : rej(new Error('تعذّرت معالجة الصورة')), 'image/jpeg', .72);
        };
        img.onerror = () => rej(new Error('ملف الصورة تالف'));
        img.src = fr.result;
      };
      fr.onerror = () => rej(new Error('تعذّرت قراءة الملف'));
      fr.readAsDataURL(file);
    });
  },

  async openChatImage(path){
    const url = await Store.imageUrl(path);
    if(!url) return this.toast('تعذّر فتح الصورة','err');
    this.sheet('صورة من الدردشة',
      `<img src="${url}" style="width:100%;border-radius:12px" alt="صورة">
       <div class="tiny dim center" style="margin-top:9px">
         صور الدردشة مؤقتة وتُحذف بعد اعتماد النتيجة.<br>
         للإثبات الدائم استخدم حقل «إثبات النتيجة».</div>`);
  },


  async playVoice(msgId, path){
    const btn = document.getElementById('vp_' + msgId);
    if(this._audio && !this._audio.paused){
      this._audio.pause();
      if(this._audioBtn) this._audioBtn.textContent = '▶';
      if(this._audioId === msgId){ this._audioId = null; return; }
    }
    const url = await Store.voiceUrl(path);
    if(!url) return this.toast('تعذّر تشغيل الرسالة','err');
    this._audio = new Audio(url);
    this._audioBtn = btn; this._audioId = msgId;
    btn.textContent = '⏸';
    this._audio.onended = () => { btn.textContent = '▶'; this._audioId = null; };
    this._audio.play().catch(()=> this.toast('تعذّر التشغيل','err'));
  },

        <button class="btn sm" onclick="UI.versionSheet()">إصدار ${U.esc(CFG.BRAND.family)}</button>
      </div>
    </div>`;

    if(t){
      const ms = await Store.matches(t.id);
      const ents = await Store.entries(t.id);
      const disputes = ms.filter(m=>m.status==='disputed');
      const pending = ms.filter(m=>m.status==='pending_confirmation');
      let total, rounds;
      if(t.kind === 'knockout'){
        let size = 1; while(size < ents.length) size *= 2;
        total = Math.max(0, ents.length - 1);
        rounds = ents.length > 1 ? Math.log2(size) : 0;
      } else {
        total = t.format==='double' ? ents.length*(ents.length-1) : ents.length*(ents.length-1)/2;
        rounds = ents.length ? (t.format==='double' ? (ents.length%2?ents.length:ents.length-1)*2 : (ents.length%2?ents.length:ents.length-1)) : 0;
      }

      h += `<div class="sec"><h2>${U.esc(t.name)}</h2><div class="rule"></div>
        <span class="tag ${t.status==='active'?'win':''}">${t.status==='active'?'جارية':'مسودة'}</span></div>
      <div class="card">
        <div class="kpis" style="margin-bottom:12px">
          <div class="kpi"><b class="num">${ents.length}</b><span>لاعب</span></div>
          <div class="kpi"><b class="num">${rounds}</b><span>${t.kind==='knockout'?'مرحلة':'جولة'}</span></div>
          <div class="kpi"><b class="num">${total}</b><span>مباراة</span></div>
          <div class="kpi"><b class="num">${ms.filter(m=>m.status==='completed').length}</b><span>مكتملة</span></div>
        </div>
        ${ents.length < 2 ? `<div class="note warn">أضف لاعبين للبطولة أولاً.</div>` :
          !ms.length ? `<button class="btn solid full" onclick="UI.generate()">${
            t.kind==='knockout' ? 'إجراء القرعة وتوليد المواجهات' : 'توليد جدول المباريات'}</button>` :
          `<div class="row tight">
            <button class="btn sm" onclick="UI.scheduleSheet()">مواعيد الجولات</button>
            <button class="btn sm danger" onclick="UI.regenerate()">إعادة توليد الجدول</button>
            <button class="btn sm" onclick="UI.tournamentForm('${t.id}')">تعديل البطولة</button>
            <button class="btn sm danger" onclick="UI.dropTournament('${t.id}')">حذف البطولة</button>
          </div>`}
      </div>`;

      const reqs = await Store.pendingRequests(t.id);
      if(reqs.length){
        h += `<div class="sec"><h2>طلبات انضمام</h2><div class="rule"></div>
          <span class="tag violet">${reqs.length}</span></div>
        <div class="card">${reqs.map(r=>`
          <div class="pick" style="cursor:default">
            ${this.av(r.player?.name)}
            <div style="flex:1;min-width:0">
              <div class="nm">${U.esc(r.player?.name||'—')}</div>
              <div class="tiny dim">${U.fmtStamp(r.created_at)}</div>
            </div>
            <button class="btn sm ok" onclick="UI.decide('${r.id}',true)">قبول</button>
            <button class="btn sm danger" onclick="UI.decide('${r.id}',false)">رفض</button>
          </div>`).join('')}</div>`;
      }

      if(disputes.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>نزاعات مفتوحة</h2><div class="rule"></div>
          <span class="tag" style="color:var(--lose)">${disputes.length}</span></div>
          ${disputes.map(m=>this.board(m,PM)).join('')}`;
      }
      if(pending.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>بانتظار التأكيد</h2><div class="rule"></div>
          <span class="tag violet">${pending.length}</span></div>
          ${pending.map(m=>this.board(m,PM)).join('')}`;
      }

      const logs = (await Store.auditLog(t.id)).slice(0,25);
      if(logs.length){
        h += `<div class="sec"><h2>سجل التدقيق</h2><div class="rule"></div></div>
        <div class="card">${logs.map(l=>`<div class="log">
          <time>${U.fmtStamp(l.created_at)}</time>
          <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
        </div>`).join('')}</div>`;
      }
    }

    if(list.length > 1){
      h += `<div class="sec"><h2>كل البطولات</h2><div class="rule"></div></div><div class="card">
        ${list.map(x=>`<button class="pick ${x.id===t?.id?'on':''}" onclick="UI.pickTournament('${x.id}')">
          <div style="width:24px;height:30px;display:grid;place-items:center;flex-shrink:0">
            ${this.trophyImg(x.trophy)}</div>
          <div class="nm">${U.esc(x.name)}<div class="tiny dim" style="font-weight:700">${U.fmtDate(x.start_date)}</div></div>
        </button>`).join('')}</div>`;
    }
    return h;
  },

  async report(id){
    const m = await Store.match(id);
    const trn = await Store.tournament(m.tournament_id);
    const wk = CFG.GAMES[trn.game || 'fc']?.scoring === 'wk';
    const by = Store.isAdmin && !(Store.me===m.player_a||Store.me===m.player_b) ? m.player_a : Store.me;
    if(!by) return this.toast('حدّد اسمك أولاً','err');

    let patch;
    if(wk){
      const wa = Number(document.getElementById('wa').value);
      const wb = Number(document.getElementById('wb').value);
      const ka = Number(document.getElementById('ka').value);
      const kb = Number(document.getElementById('kb').value);
      if([wa,wb,ka,kb].some(v => !Number.isInteger(v) || v < 0))
        return this.toast('أدخل أرقاماً صحيحة','err');
      if(wa === wb && ka === kb)
        return this.toast('تعادل تام — لا بد أن يتفوق أحدهما في Wins أو Kills','err');
      patch = { wins_a:wa, wins_b:wb, kills_a:ka, kills_b:kb,
                score_a:null, score_b:null, pen_a:null, pen_b:null };
    } else {
      const sa = Number(document.getElementById('sa').value);
      const sb = Number(document.getElementById('sb').value);
      if(!Number.isInteger(sa) || !Number.isInteger(sb) || sa<0 || sb<0)
        return this.toast('أدخل نتيجة صحيحة','err');
      let pen = { pen_a:null, pen_b:null };
      if(trn.kind === 'knockout' && sa === sb){
        const pa = Number(document.getElementById('pa')?.value);
        const pb = Number(document.getElementById('pb')?.value);
        if(!Number.isInteger(pa) || !Number.isInteger(pb) || pa === pb)
          return this.toast('أدخل ركلات الترجيح — لا تعادل في الكأس','err');
        pen = { pen_a:pa, pen_b:pb };
      }
      patch = { score_a:sa, score_b:sb, ...pen };
    }

    await Store.updateMatch(id, {
      ...patch, status: 'pending_confirmation', result_type: 'normal',
      reported_by: by, reported_at: U.nowISO(), result_at: U.nowISO()
    });
    if(this._evidence.length){ await Store.addEvidence(id, this._evidence); }
    this._evidence = [];
    await Store.log(m.tournament_id, id, 'تسجيل النتيجة',
      wk ? `${patch.wins_a} – ${patch.wins_b} Wins` : `${patch.score_a} – ${patch.score_b}`);
    this.render(); this.toast('سُجّلت — بانتظار تأكيد الخصم','ok');
  },

  /* يعيد تسمية أنواع البطولة حسب اللعبة، ويُظهر حقول النقاط عند اللزوم */
  gameSwitch(){
    const g = document.querySelector('#tgame .on')?.dataset.v || 'fc';
    const wk = CFG.GAMES[g]?.scoring === 'wk';
    document.querySelectorAll('#tk button').forEach(b => {
      const k = b.dataset.v;
      b.querySelector('[data-ar]').textContent = CFG.kindLabel(g, k);
      b.querySelector('[data-en]').textContent = CFG.kindEn(g, k);
    });
    const gh = document.getElementById('ghint');
    if(gh) gh.textContent = wk
      ? 'النتيجة: Wins + Kills — إحصائياتها مستقلة تماماً.'
      : 'النتيجة: أهداف — نقاط وترتيب الدوري المعتاد.';
    this.kindSwitch();
  },
  kindSwitch(){
    const g = document.querySelector('#tgame .on')?.dataset.v || 'fc';
    const wk = CFG.GAMES[g]?.scoring === 'wk';
    const k = document.querySelector('#tk .on')?.dataset.v || 'league';
    const cup = k === 'knockout';

    const fmt = document.getElementById('fmtfield');
    if(fmt) fmt.style.display = (cup || wk) ? 'none' : '';   // النظام يخصّ دوري FC
    const pts = document.getElementById('wkpts');
    if(pts) pts.style.display = (wk && !cup) ? '' : 'none';

    const kh = document.getElementById('khint');
    if(kh){
      kh.textContent = cup
        ? (wk ? 'اللاعبان يتواجهان، والفائز ينتقل للمرحلة التالية والخاسر يخرج، حتى يتحدّد الفائز النهائي.'
              : 'مباراة واحدة، الفائز يتأهل والخاسر يخرج.')
        : (wk ? 'عدة مباريات، تُجمع نقاط كل لاعب، وصاحب أعلى مجموع في النهاية هو الفائز.'
              : 'كل لاعب يواجه الجميع، والترتيب بالنقاط.');
    }
  },
  seg(el){ [...el.parentNode.children].forEach(b=>b.classList.remove('on')); el.classList.add('on'); },
  async saveTournament(id){
    const name = document.getElementById('tn').value.trim();
    if(!name) return this.toast('اكتب اسم البطولة','err');
    const kind = document.querySelector('#tk .on').dataset.v;
    const game = document.querySelector('#tgame .on')?.dataset.v || 'fc';
    const wk = CFG.GAMES[game]?.scoring === 'wk';
    const start = document.getElementById('ts').value || U.today();
    const end = document.getElementById('te').value || null;
    if(end && end < start) return this.toast('تاريخ النهاية قبل البداية','err');

    let points = null;
    if(wk && kind !== 'knockout'){
      const w = Number(document.getElementById('pw').value);
      const k = Number(document.getElementById('pk').value);
      if(!Number.isInteger(w) || !Number.isInteger(k) || w < 0 || k < 0)
        return this.toast('أوزان النقاط يجب أن تكون أرقاماً صحيحة','err');
      if(w === 0 && k === 0) return this.toast('لا يمكن أن يكون الوزنان صفراً','err');
      points = { win:w, kill:k };
    }

    const data = {
      name, kind, game, points,
      trophy: Number(document.querySelector('#tcup .tpick.on')?.dataset.v) || 1,
      join_mode: document.querySelector('#tj .on').dataset.v,
      format: (kind === 'knockout' || wk) ? 'single' : document.querySelector('#tf .on').dataset.v,
      start_date: start, end_date: end,
      gap_days: Number(document.getElementById('tg').value) || 2,
      match_time: document.getElementById('tt').value || CFG.DEFAULT_TIME
    };
    try{
      if(id){ await Store.updateTournament(id, data); }
      else { const t = await Store.createTournament(data); await Store.setActiveTournament(t.id); }
      this.closeSheet(); this.render(); this.toast('تم الحفظ','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },
  async dropTournament(id){
    if(!window.confirm('حذف البطولة وكل مبارياتها نهائياً؟')) return;
    await Store.deleteTournament(id); this.render(); this.toast('حُذفت البطولة','err');
  },

  async redistribute(){
    const t = await Store.activeTournament();
    const start = document.getElementById('sc_start').value;
    const gap = Math.max(1, Number(document.getElementById('sc_gap').value)||2);
    if(!start) return this.toast('اختر تاريخ البداية','err');
    const ds = [...document.querySelectorAll('[data-k="d"]')];
    ds.forEach(el=>{ el.value = U.addDays(start, (Number(el.dataset.r)-1) * gap); });
    const last = ds.length ? U.addDays(start, (ds.length-1)*gap) : start;
    if(t.end_date && last > t.end_date)
      this.toast('⚠️ الجدول يتجاوز نهاية البطولة','err');
    await Store.updateTournament(t.id, { start_date:start, gap_days:gap });
    if(!(t.end_date && last > t.end_date)) this.toast('وُزّعت — اضغط حفظ المواعيد');
  },
  async saveSchedule(){
    const t = await Store.activeTournament();
    const ds = [...document.querySelectorAll('[data-k="d"]')];
    try{
      for(const el of ds){
        const r = Number(el.dataset.r);
        const tm = document.querySelector(`[data-r="${r}"][data-k="t"]`).value;
        await Store.setRoundSchedule(t.id, r, el.value, tm);
      }
      await Store.refreshTournament(t.id);
      await Store.log(t.id, null, 'تعديل مواعيد الجولات', `${ds.length} جولة`);
      this.closeSheet(); this.render(); this.toast('حُفظت المواعيد','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async entriesSheet(){
    const t = await Store.activeTournament();
    const all = await Store.players();
    const cur = (await Store.entries(t.id)).map(e=>e.player_id);
    const ms = await Store.matches(t.id);
    this.sheet('مشاركو ' + U.esc(t.name), `
      ${ms.length?`<div class="note warn">الجدول مُولَّد. تغيير المشاركين يتطلب إعادة توليد الجدول.</div>`:''}
      ${all.length ? all.map(p=>`<button class="pick ${cur.includes(p.id)?'on':''}" data-p="${p.id}" onclick="this.classList.toggle('on')">
        ${this.av(p.name)}<div class="nm">${U.esc(p.name)}</div>
      </button>`).join('') : `<div class="empty"><p>أضف لاعبين للسجل أولاً.</p></div>`}
      <button class="btn solid full" style="margin-top:10px" onclick="UI.saveEntries()">حفظ المشاركين</button>`);
  },
  async saveEntries(){
    const t = await Store.activeTournament();
    const ids = [...document.querySelectorAll('.pick.on[data-p]')].map(b=>b.dataset.p);
    if(ids.length < 2) return this.toast('اختر لاعبين اثنين على الأقل','err');
    try{
      await Store.setEntries(t.id, ids);
      await Store.log(t.id, null, 'تحديث المشاركين', `${ids.length} لاعب`);
      this.closeSheet(); this.render(); this.toast('حُفظ المشاركون','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  /* — القرعة والتوليد — */
  async seedSheet(){
    const t = await Store.activeTournament();
    const ents = await Store.entries(t.id);
    const others = (await Store.tournaments()).filter(x => x.id !== t.id && x.kind !== 'knockout');
    let size = 1; while(size < ents.length) size *= 2;
    this._seed = ents.map(e => e.player_id);

    this.sheet('القرعة', `
      <div class="note">${ents.length} لاعباً في شجرة من ${size} مقعداً —
        ${size - ents.length ? `${size - ents.length} يعبرون الدور الأول مباشرة` : 'بلا إعفاءات'}.</div>
      <div class="field"><label>طريقة القرعة</label>
        <div class="seg" id="sd">
          <button class="on" data-v="random" onclick="UI.seg(this);UI.seedMode()">عشوائية</button>
          <button data-v="prev" onclick="UI.seg(this);UI.seedMode()">ترتيب دوري</button>
          <button data-v="manual" onclick="UI.seg(this);UI.seedMode()">يدوية</button>
        </div></div>
      <div id="sdprev" style="display:none" class="field">
        <label>البطولة المرجعية</label>
        <select class="input" id="sdsrc">
          ${others.length ? others.map(x=>`<option value="${x.id}">${U.esc(x.name)}</option>`).join('')
            : '<option value="">لا توجد بطولات سابقة</option>'}
        </select>
      </div>
      <div id="sdlist" style="display:none">
        <label style="display:block;font-size:.65rem;font-weight:800;color:var(--ink-2);margin-bottom:6px">
          الترتيب — الأول يواجه الأخير</label>
        <div id="sdrows" style="max-height:40vh;overflow-y:auto"></div>
      </div>
      <button class="btn solid full" style="margin-top:11px" onclick="UI.buildBracket()">توليد الشجرة</button>`);
  },
  seedMode(){
    const v = document.querySelector('#sd .on').dataset.v;
    document.getElementById('sdprev').style.display = v === 'prev' ? '' : 'none';
    document.getElementById('sdlist').style.display = v === 'manual' ? '' : 'none';
    if(v === 'manual') this.seedRows();
  },
  async seedRows(){
    const PM = await this.playersMap();
    document.getElementById('sdrows').innerHTML = this._seed.map((id,i)=>`
      <div class="pick" style="cursor:default">
        <div class="rank num">${i+1}</div>
        <div class="nm">${U.esc(PM[id]?.name||'—')}</div>
        <button class="btn sm" onclick="UI.seedMove(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="btn sm" onclick="UI.seedMove(${i},1)" ${i===this._seed.length-1?'disabled':''}>↓</button>
      </div>`).join('');
  },
  seedMove(i, d){
    const j = i + d;
    if(j < 0 || j >= this._seed.length) return;
    [this._seed[i], this._seed[j]] = [this._seed[j], this._seed[i]];
    this.seedRows();
  },
  async buildBracket(){
    const t = await Store.activeTournament();
    const mode = document.querySelector('#sd .on').dataset.v;
    let ids = this._seed.slice();

    if(mode === 'random'){
      for(let i = ids.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
    } else if(mode === 'prev'){
      const src = document.getElementById('sdsrc').value;
      if(!src) return this.toast('لا توجد بطولة مرجعية','err');
      await Store.refreshTournament(src);
      const rows = Engine.standings(await Store.matches(src), await Store.entries(src));
      const rank = {}; rows.forEach((r,i)=> rank[r.id] = i);
      ids.sort((a,b)=> (rank[a] ?? 999) - (rank[b] ?? 999));
    }

    const br = Engine.bracket(ids, U.uuid);
    const list = br.matches.map(m => ({
      id: m.id, tournament_id: t.id, round: m.round, slot: m.slot,
      player_a: m.player_a, player_b: m.player_b,
      next_match_id: m.next_match_id, next_slot: m.next_slot,
      match_date: U.addDays(t.start_date, (m.round - 1) * t.gap_days),
      match_time: t.match_time, status: 'scheduled'
    }));

    try{
      await Store.saveMatches(list);
      await Store.updateTournament(t.id, { status:'active' });
      await Store.log(t.id, null, 'توليد الشجرة',
        `${list.length} مباراة · ${br.rounds} أدوار · ${br.byes} إعفاء`);
      this.closeSheet(); this.render();
      this.toast(`تولّدت شجرة من ${br.size}`,'ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async generate(){
    const t = await Store.activeTournament();
    if(t.kind === 'knockout') return this.seedSheet();
    const ents = await Store.entries(t.id);
    const ids = ents.map(e=>e.player_id);
    const legs = Engine.fixtures(ids, t.format === 'double');

    if(t.end_date){
      const last = U.addDays(t.start_date, (legs.length-1) * t.gap_days);
      if(last > t.end_date){
        const need = Math.floor(U.diffDays(t.start_date, t.end_date) / Math.max(1, legs.length-1));
        return this.toast(`⚠️ المدة لا تكفي — الجدول ينتهي ${U.fmtDate(last)}. جرّب فاصل ${Math.max(1,need)} يوم`,'err');
      }
    }

    const list = [];
    legs.forEach((pairs, i) => {
      const date = U.addDays(t.start_date, i * t.gap_days);
      pairs.forEach(([a,b]) => list.push({
        tournament_id: t.id, round: i+1,
        player_a: a, player_b: b,
        match_date: date, match_time: t.match_time,
        status: 'scheduled'
      }));
    });
    try{
      await Store.saveMatches(list);
      await Store.updateTournament(t.id, { status:'active' });
      await Store.log(t.id, null, 'توليد الجدول', `${list.length} مباراة · ${legs.length} جولة`);
      this.render();
      this.toast(`تولّد ${list.length} مباراة في ${legs.length} جولة`,'ok');
    }catch(e){ this.toast(e.message,'err'); }
  },
  async regenerate(){
    if(!window.confirm('إعادة التوليد تحذف كل المباريات ونتائجها. متابعة؟')) return;
    const t = await Store.activeTournament();
    await Store.clearMatches(t.id);
    await Store.log(t.id, null, 'حذف الجدول');
    await this.generate();
  },

  /* — حالات فارغة — */
  notConfigured(){
    document.getElementById('view').innerHTML = `
      <div class="empty" style="margin-top:60px">
        <h3>التطبيق غير مربوط بعد</h3>
        <p>افتح الملف وعبّئ <b>CFG.SB</b> ببيانات مشروع Supabase.</p>
      </div>`;
    return null;
  },
  steps(stage){
    const st = [
      { b:'أنشئ حسابك', s:'اسم مستخدم وكلمة مرور', ok: !!Store.session },
      { b:'اربط اسمك', s:'لتظهر لك مبارياتك', ok: !!Store.myPlayer },
      { b: stage==='fixtures' ? 'انطلاق الجولة الأولى' : 'إعلان البطولة',
        s: stage==='fixtures' ? 'الجدول قيد الإعداد' : 'بانتظار المشرفين', ok:false }
    ];
    const first = st.findIndex(x=>!x.ok);
    return `<div class="steps">${st.map((x,i)=>{
      const cls = x.ok ? 'done' : (i===first ? 'now' : 'pending');
      return `<div class="step ${cls}">
        <i>${x.ok ? '✓' : i+1}</i>
        <div><b>${x.b}</b><small>${x.s}</small></div>
      </div>`;
    }).join('')}</div>`;
  },
  waiting(title, body, stage){
    return `<div class="wait">
      <div class="wait-mark"><span>${U.esc(CFG.BRAND.game)}</span></div>
      <h3>${title}</h3>
      <p>${body}</p>
      ${this.steps(stage)}
      ${!Store.session ? `<button class="btn solid" style="margin-top:24px"
          onclick="UI.identitySheet()">أنشئ حسابك الآن</button>` : ''}
      ${Store.session && !Store.myPlayer ? `<button class="btn solid" style="margin-top:24px"
          onclick="UI.linkSheet()">اربط اسمك</button>` : ''}
    </div>`;
  },

  /* — العرض — */
  async render(){
    const view = document.getElementById('view');
    const [, seg, param, sub] = location.hash.replace('#','').split('/');
    this.state.route = '/' + (seg || '');
    this.state.param = param || null;
    this.state.sub = sub || null;
    let html = '';
    if(!Store.configured) return this.notConfigured();
    try{
      await Store.syncActive();
      if(seg === 'matches')      html = await this.viewMatchCenter();
      else if(seg === 'stats')   html = await this.viewStats();
      else if(seg === 'g')       html = await this.viewGame(param);
      else if(seg === 't')       html = await this.viewTournament(param);
      else if(seg === 'player')  html = await this.viewPlayer(param);
      else if(seg === 'admin')   html = await this.viewAdmin();
      else if(seg === 'match')   html = await this.viewMatch(param);
      else if(seg === 'account') html = await this.viewAccount();
      else html = await this.viewTournaments();
    }catch(e){
      console.error(e);
      html = `<div class="empty"><h3>تعذّر تحميل البيانات</h3><p>${U.esc(e.message)}</p>
        <button class="btn" onclick="Store.reload().then(()=>UI.render())">إعادة المحاولة</button></div>`;
    }
    view.innerHTML = html + this.foot();
    await this.chrome();
    window.scrollTo({top:0});

    if(Store.configured) Store.unwatchChat();
    if(this._chatFor){
      const cid = this._chatFor;
      const PM = await this.playersMap();
      await this.loadChat(cid, PM);
      Store.watchChat(cid, () => this.loadChat(cid, PM));
    }
  }
};

/* ─────────── 7) الإقلاع ─────────── */
window.addEventListener('hashchange', ()=>{
  UI.state.roundView = null; UI.state.tab = null;
  UI.render();
});
(async function boot(){
  try{ await Store.init(); }
  catch(e){ console.error(e); }
  document.title = CFG.BRAND.label + ' — منصة المباريات';
  if(!location.hash) location.hash = '#/';
  await UI.render();
  if(Store.configured) Store.watch(Store.db.meta.activeTournament);
})();
</script>
</body>
